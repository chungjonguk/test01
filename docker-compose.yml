services:
  postgres:
    image: postgres:16
    container_name: printmall-postgres
    environment:
      POSTGRES_DB: spring_boot_app
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-appuser}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-apppass}
      TZ: Asia/Seoul
    ports:
      - "5433:5432"   # 호스트 5433 → 컨테이너 5432 (로컬 PostgreSQL 5432와 충돌 방지)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-appuser} -d spring_boot_app"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printmall-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/spring_boot_app
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-appuser}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-apppass}
      APP_STORAGE_NAS_BASE_PATH: /data/nas-storage/printmall
      APP_PUBLIC_PATH_SECRET: ${APP_PUBLIC_PATH_SECRET:-PrintMall-PublicPath-ChangeInProduction}
      RRNO_CRYPTO_SECRET_KEY: ${RRNO_CRYPTO_SECRET_KEY:-abcdefghijklmnopqrstuvwxyz123456}
      TZ: Asia/Seoul
    ports:
      - "8081:8081"
    volumes:
      - nas-storage:/data/nas-storage/printmall
      - app-logs:/app/logs
    restart: unless-stopped

volumes:
  postgres-data:
  nas-storage:
  app-logs:
