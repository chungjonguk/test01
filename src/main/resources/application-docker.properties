# =========================================================================
# Docker 컨테이너 전용 프로필 (spring.profiles.active=docker)
# - 템플릿/정적 리소스: jar 내부 classpath 사용 (개발용 file:src/... 무력화)
# - DB/NAS/시크릿: 환경변수로 오버라이드 가능 (docker-compose 참고)
# =========================================================================

# --- 뷰/정적 리소스: 패키징된 jar 기준 ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.cache=true
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600
spring.web.resources.chain.cache=true

# --- DevTools 비활성 (운영/컨테이너) ---
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# --- DataSource: docker-compose의 postgres 서비스 ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/spring_boot_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:apppass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Windows 전용 MySQL 자동 기동 스크립트 비활성 (컨테이너는 postgres 서비스 사용)
app.datasource.auto-bootstrap-mysql=false
# Spring 컨텍스트 기동 후 DataSource 접속 재확인 (mysql 준비 대기)
app.datasource.startup-check=true
app.datasource.startup-check-max-wait-sec=90
app.datasource.startup-check-retry-sec=3

# 기동 시 schema/*.sql 자동 적용 (빈 DB 초기화)
app.schema.auto-apply=true

# --- NAS 파일 저장: 컨테이너 내부 경로 (볼륨 마운트) ---
app.storage.nas.enabled=true
app.storage.nas.base-path=${APP_STORAGE_NAS_BASE_PATH:/data/nas-storage/printmall}

# --- 시크릿 (운영은 반드시 환경변수로 교체) ---
app.public-path.secret=${APP_PUBLIC_PATH_SECRET:PrintMall-PublicPath-ChangeInProduction}
app.crypto.rrno.secret-key=${RRNO_CRYPTO_SECRET_KEY:abcdefghijklmnopqrstuvwxyz123456}

# --- 로그: 컨테이너 표준 경로 ---
logging.file.path=/app/logs
