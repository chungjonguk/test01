
# 로컬 전용 설정 (REST API 키 등, git 제외) — 있으면 자동 로드
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# Server
server.port=8081

# HTTP 세션: 로그인 후 비활성 10분이면 만료 (server.servlet.session.timeout 와 동일)
server.servlet.session.timeout=10m
app.auth.session-timeout-minutes=10

# 접속 로그: 로그인 사용자 화면(GET) 접속 PAGE 이력 기록
app.access-log.page-enabled=true

# /app/** 는 AppController 등이 MVC로 처리합니다.
# Falcon 페이지: http://localhost:8080/app/...

# Application Name
spring.application.name=spring-boot-app

# UI 브랜드명 (네비게이션·페이지 제목 기본값)
app.brand-name=PrintMall

# Korean / UTF-8 Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
spring.messages.encoding=UTF-8
spring.web.locale=ko_KR
spring.web.locale-resolver=fixed

# --- DevTools: Cursor/STS 등 외부 에디터에서 저장 시 실행 중 서버에 반영 ---
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=500ms
spring.devtools.restart.additional-paths=src/main/java,src/main/resources

# Thymeleaf Configuration (로컬: src 직접 로드 — mvn compile 없이 저장 반영, prod는 application-prod.properties)
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Static Resources Configuration (개발: src 직접 로드 + classpath, 캐시 없음)
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Multipart upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# --- NAS 파일 저장 (D 드라이브) — 이미지·문서·영상·상품이미지 ---
app.storage.nas.enabled=true
app.storage.nas.base-path=D:/nas-storage/printmall
app.storage.nas.upload-subdir=uploads
app.storage.nas.url-prefix=/uploads

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.example.springbootapp=DEBUG
logging.file.path=logs

# --- DataSource (MyBatis·JPA 공용) ---
# 서버 기동 시 DB: Windows면 ensure-mysql.bat로 MySQL 기동·접속 후 앱 시작 (test 제외)
app.datasource.auto-bootstrap-mysql=true
# Spring 컨텍스트 기동 후 DataSource 접속 재확인 (실패 시 기동 중단)
app.datasource.startup-check=true
app.datasource.startup-check-max-wait-sec=30
app.datasource.startup-check-retry-sec=2
# allowPublicKeyRetrieval: MySQL 8 caching_sha2_password JDBC 연결 시 필수
spring.datasource.url=jdbc:mysql://localhost:3306/spring_boot_app?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false&nullCatalogMeansCurrent=true
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=true
spring.datasource.hikari.data-source-properties.useSSL=false
spring.datasource.username=redcroxx
spring.datasource.password=jonguk0412
# spring.datasource.username=springuser
# spring.datasource.password=spring1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Spring Boot 계층 (업무: user) ---
# controller -> service -> mapper + resources/mapper/*.xml -> domain
# REST: controller.ApiController  |  Falcon UI: controller.page.*
# --- MyBatis ---
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.springbootapp.domain
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30
logging.level.com.example.springbootapp.mapper=DEBUG

# 주민번호 AES-256 암호화 키 (정확히 32자). 운영: RRNO_CRYPTO_SECRET_KEY 환경 변수 필수
app.crypto.rrno.secret-key=${RRNO_CRYPTO_SECRET_KEY:abcdefghijklmnopqrstuvwxyz123456}

# Kakao Login / Local API (동일 REST API 키 — developers.kakao.com 앱 > 앱 키)
kakao.client-id=YOUR_KAKAO_REST_API_KEY
kakao.rest-api-key=${KAKAO_REST_API_KEY:${kakao.client-id}}
# 카카오맵 JS SDK 전용 (REST API 키와 다름 — 반드시 JavaScript 키만 입력)
kakao.javascript-key=${KAKAO_JAVASCRIPT_KEY:}
kakao.local.address-search-url=https://dapi.kakao.com/v2/local/search/address.json
kakao.local.keyword-search-url=https://dapi.kakao.com/v2/local/search/keyword.json
kakao.local.coord2address-url=https://dapi.kakao.com/v2/local/geo/coord2address.json
# API 키 없을 때 샘플 주소로 UI 테스트 (운영: false)
kakao.local.mock-enabled=true
# 지도/로컬 API 미활성화(403) 시 데모 주소로 대체 (콘솔에서 API 켠 뒤 false 권장)
kakao.local.fallback-mock-on-local-disabled=true
kakao.client-secret=
kakao.redirect-uri=http://localhost:8081/auth/kakao/callback
kakao.authorize-url=https://kauth.kakao.com/oauth/authorize
kakao.token-url=https://kauth.kakao.com/oauth/token
kakao.userinfo-url=https://kapi.kakao.com/v2/user/me

# Naver Login (네이버 개발자센터 > Application > API 설정)
naver.client-id=YOUR_NAVER_CLIENT_ID
naver.client-secret=YOUR_NAVER_CLIENT_SECRET
naver.redirect-uri=http://localhost:8081/auth/naver/callback
naver.authorize-url=https://nid.naver.com/oauth2.0/authorize
naver.token-url=https://nid.naver.com/oauth2.0/token
naver.userinfo-url=https://openapi.naver.com/v1/nid/me

# Error Page Configuration (없는 URL·연결 실패 → error/404.html)
server.error.whitelabel.enabled=false
server.error.path=/error
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

