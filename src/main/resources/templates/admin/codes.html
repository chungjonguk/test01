<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <th:block th:replace="~{layout :: body}">
    <div th:fragment="page-content">
          <div class="card mb-3" id="code-management-panel">
            <div class="card-header">
              <div class="row flex-between-center">
                <div class="col-auto">
                  <h5 class="mb-0">코드 관리</h5>
                  <p class="fs--1 mb-0 text-600">위: 코드그룹 · 아래: 상세코드 (그리드 상단에서 추가·삭제)</p>
                </div>
                <div class="col-auto">
                  <button class="btn btn-falcon-default btn-sm" type="button" id="code-export-btn"><span class="fas fa-download me-1"></span>CSV</button>
                  <button class="btn btn-primary btn-sm ms-2" type="button" id="code-save-btn"><span class="fas fa-save me-1"></span>저장</button>
                </div>
              </div>
            </div>
            <div class="card-body">
              <div class="card border mb-3 code-mgmt-search-panel">
                <div class="card-header py-2 bg-light">
                  <div class="row flex-between-center">
                    <div class="col-auto">
                      <h6 class="mb-0"><span class="fas fa-search me-2"></span>코드그룹 조회</h6>
                    </div>
                    <div class="col-auto">
                      <span class="badge badge-soft-info" id="code-search-result-count">0건</span>
                    </div>
                  </div>
                </div>
                <div class="card-body pb-2">
                  <form id="code-group-search-form" class="row g-2 align-items-end">
                    <div class="col-md-3 col-sm-6">
                      <label class="form-label fs--1 mb-1" for="search-group-key">코드</label>
                      <input class="form-control form-control-sm" id="search-group-key" type="text" placeholder="예: ORDER_STATUS" autocomplete="off" />
                    </div>
                    <div class="col-md-3 col-sm-6">
                      <label class="form-label fs--1 mb-1" for="search-group-name">코드명</label>
                      <input class="form-control form-control-sm" id="search-group-name" type="text" placeholder="예: 주문상태" autocomplete="off" />
                    </div>
                    <div class="col-md-2 col-sm-4">
                      <label class="form-label fs--1 mb-1" for="search-group-use">사용여부</label>
                      <select class="form-select form-select-sm" id="search-group-use">
                        <option value="">전체</option>
                        <option value="Y">사용</option>
                        <option value="N">미사용</option>
                      </select>
                    </div>
                    <div class="col-md-4 col-sm-8">
                      <div class="d-flex flex-wrap gap-2">
                        <button class="btn btn-primary btn-sm" type="submit" id="btn-search-groups"><span class="fas fa-search me-1"></span>조회</button>
                        <button class="btn btn-falcon-default btn-sm" type="button" id="btn-reset-search"><span class="fas fa-redo me-1"></span>초기화</button>
                      </div>
                    </div>
                  </form>
                </div>
                <div class="card-body pt-0 px-0">
                  <div class="table-responsive scrollbar code-mgmt-search-table-wrap">
                    <table class="table table-sm table-striped table-hover fs--1 mb-0">
                      <thead class="bg-200 text-900">
                        <tr>
                          <th class="ps-3 text-center" style="width:3rem">No</th>
                          <th>코드</th>
                          <th>코드명</th>
                          <th class="text-center">사용</th>
                          <th>등록자</th>
                          <th>등록일시</th>
                          <th>수정자</th>
                          <th>수정일시</th>
                        </tr>
                      </thead>
                      <tbody id="code-group-search-grid-body">
                        <tr>
                          <td colspan="8" class="text-center text-600 py-4">조회 버튼을 눌러 그룹 정보를 불러오세요.</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>

              <div class="row g-3 code-mgmt-split code-mgmt-stack">
                <div class="col-12">
                  <div class="card border code-mgmt-pane code-mgmt-pane-group">
                    <div class="card-header py-2 bg-light">
                      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <h6 class="mb-0"><span class="fas fa-folder me-2"></span>코드그룹</h6>
                        <div class="d-flex flex-wrap gap-2 code-mgmt-grid-toolbar">
                          <button class="btn btn-falcon-primary btn-sm btn-add-group" type="button" title="코드그룹 추가"><span class="fas fa-plus me-1"></span>추가</button>
                          <button class="btn btn-falcon-danger btn-sm btn-del-group" type="button" title="코드그룹 삭제"><span class="fas fa-minus me-1"></span>삭제</button>
                        </div>
                      </div>
                    </div>
                    <div class="card-body p-0">
                      <div class="table-responsive scrollbar code-mgmt-table-wrap">
                        <table class="table table-sm table-hover fs--1 mb-0">
                          <thead class="bg-200 text-900">
                            <tr>
                              <th class="code-mgmt-check-col">
                                <div class="form-check fs-0 mb-0 d-flex align-items-center justify-content-center">
                                  <input class="form-check-input" id="code-group-check-all" type="checkbox" title="전체 선택" aria-label="코드그룹 전체 선택" />
                                </div>
                              </th>
                              <th class="ps-3 text-center" style="width:3rem">No</th>
                              <th>코드</th>
                              <th>코드명</th>
                              <th class="text-center">건수</th>
                              <th>등록자</th>
                              <th>등록일시</th>
                              <th>수정자</th>
                              <th>수정일시</th>
                            </tr>
                          </thead>
                          <tbody id="code-group-grid-body"></tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-12">
                  <div class="card border code-mgmt-pane code-mgmt-pane-detail">
                    <div class="card-header py-2 bg-light">
                      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <div class="d-flex align-items-center flex-wrap gap-2">
                          <h6 class="mb-0"><span class="fas fa-list me-2"></span>상세코드</h6>
                          <span class="badge badge-soft-primary" id="selected-group-badge">그룹 선택</span>
                        </div>
                        <div class="d-flex flex-wrap gap-2 code-mgmt-grid-toolbar">
                          <button class="btn btn-falcon-primary btn-sm btn-add-code" type="button" title="상세코드 추가"><span class="fas fa-plus me-1"></span>추가</button>
                          <button class="btn btn-falcon-danger btn-sm btn-del-code" type="button" title="상세코드 삭제"><span class="fas fa-minus me-1"></span>삭제</button>
                        </div>
                      </div>
                    </div>
                    <div class="card-body p-0">
                      <div class="table-responsive scrollbar code-mgmt-table-wrap">
                        <table class="table table-sm table-hover fs--1 mb-0">
                          <thead class="bg-200 text-900">
                            <tr>
                              <th class="code-mgmt-check-col">
                                <div class="form-check fs-0 mb-0 d-flex align-items-center justify-content-center">
                                  <input class="form-check-input" id="code-detail-check-all" type="checkbox" title="전체 선택" aria-label="상세코드 전체 선택" disabled="disabled" />
                                </div>
                              </th>
                              <th class="ps-3 text-center" style="width:3rem">No</th>
                              <th>코드</th>
                              <th>코드명</th>
                              <th class="text-center">정렬</th>
                              <th class="text-center">사용</th>
                              <th>등록자</th>
                              <th>등록일시</th>
                              <th>수정자</th>
                              <th>수정일시</th>
                            </tr>
                          </thead>
                          <tbody id="code-detail-grid-body"></tbody>
                        </table>
                      </div>
                      <div class="text-center text-600 fs--1 py-5 d-none" id="code-detail-empty">위 코드그룹 그리드에서 그룹을 선택하세요.</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    </th:block>
</body>
</html>
