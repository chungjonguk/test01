<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <th:block th:replace="~{layout :: body}">
    <div th:fragment="page-content">
          <div class="card mb-3" id="company-management-panel">
            <div class="card-header">
              <div class="row flex-between-center g-2">
                <div class="col-12 col-lg">
                  <h5 class="mb-0">업체 관리</h5>
                  <p class="fs--1 mb-0 text-600">biz_company · 거래처 등록·수정·삭제</p>
                </div>
                <div class="col-12 col-lg-auto">
                  <button class="btn btn-primary btn-sm" type="button" id="btn-company-add"><span class="fas fa-plus me-1"></span>업체 등록</button>
                </div>
              </div>
            </div>
            <div class="card-body">
              <div class="card border mb-3">
                <div class="card-header py-2 bg-light">
                  <h6 class="mb-0"><span class="fas fa-search me-2"></span>조회 조건</h6>
                </div>
                <div class="card-body pb-2">
                  <form id="company-search-form" class="row g-2 align-items-end">
                    <div class="col-12 col-sm-6 col-lg-3">
                      <label class="form-label fs--1 mb-1" for="search-company-nm">업체명</label>
                      <input class="form-control form-control-sm" id="search-company-nm" type="text" placeholder="업체명" autocomplete="off" />
                    </div>
                    <div class="col-12 col-sm-6 col-lg-2">
                      <label class="form-label fs--1 mb-1" for="search-biz-no">사업자번호</label>
                      <input class="form-control form-control-sm" id="search-biz-no" type="text"
                        inputmode="numeric" placeholder="000-00-00000" maxlength="12" autocomplete="off" />
                    </div>
                    <div class="col-6 col-sm-4 col-lg-2">
                      <label class="form-label fs--1 mb-1" for="search-status-cd">상태</label>
                      <select class="form-select form-select-sm" id="search-status-cd">
                        <option value="">전체</option>
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                      </select>
                    </div>
                    <div class="col-6 col-sm-4 col-lg-2">
                      <label class="form-label fs--1 mb-1" for="search-use-yn">사용</label>
                      <select class="form-select form-select-sm" id="search-use-yn">
                        <option value="">전체</option>
                        <option value="Y">Y</option>
                        <option value="N">N</option>
                      </select>
                    </div>
                    <div class="col-12 col-lg-3">
                      <div class="d-flex flex-wrap gap-2">
                        <button class="btn btn-primary btn-sm" type="submit" id="btn-search-companies"><span class="fas fa-search me-1"></span>조회</button>
                        <button class="btn btn-falcon-default btn-sm" type="button" id="btn-reset-company-search"><span class="fas fa-redo me-1"></span>초기화</button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>

              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
                <span class="badge badge-soft-info" id="company-result-count">0건</span>
                <button type="button" class="btn btn-danger btn-sm" id="btn-company-delete-selected" disabled>
                  <span class="fas fa-trash-alt me-1"></span>선택 삭제
                </button>
              </div>

              <div class="table-responsive scrollbar">
                <table class="table table-sm table-striped table-hover fs--1 mb-0">
                  <thead class="bg-200 text-900">
                    <tr>
                      <th class="text-center" style="width:2.5rem">
                        <input class="form-check-input" type="checkbox" id="company-check-all" title="전체 선택" aria-label="전체 선택" />
                      </th>
                      <th class="ps-3 text-center">ID</th>
                      <th>업체명</th>
                      <th class="d-none d-md-table-cell">사업자번호</th>
                      <th class="d-none d-lg-table-cell">대표자</th>
                      <th class="d-none d-xl-table-cell">전화</th>
                      <th class="text-center">상태</th>
                      <th class="text-center">사용</th>
                      <th class="text-end pe-3">관리</th>
                    </tr>
                  </thead>
                  <tbody id="company-grid-body">
                    <tr>
                      <td colspan="9" class="text-center text-600 py-4">조회 버튼을 눌러 업체 목록을 불러오세요.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <nav th:replace="~{fragments/grid-pager :: pager('company-grid-pager')}"></nav>
            </div>
          </div>

          <div class="modal fade" id="company-form-modal" tabindex="-1" aria-labelledby="company-form-modal-label" aria-hidden="true">
            <div class="modal-dialog modal-lg">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="company-form-modal-label">업체 등록</h5>
                  <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="company-form">
                  <div class="modal-body">
                    <input type="hidden" id="form-company-id" />
                    <div class="row g-2">
                      <div class="col-12">
                        <label class="form-label" for="form-company-nm">업체명 <span class="text-danger">*</span></label>
                        <input class="form-control form-control-sm" id="form-company-nm" type="text" required="required" maxlength="200" />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label" for="form-biz-no">사업자등록번호</label>
                        <input class="form-control form-control-sm" id="form-biz-no" type="text"
                          inputmode="numeric" placeholder="000-00-00000" maxlength="12"
                          autocomplete="off" title="숫자 10자리 (자동 하이픈)" />
                        <div class="form-text">숫자만 입력하면 000-00-00000 형식으로 맞춰집니다.</div>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label" for="form-ceo-nm">대표자명</label>
                        <input class="form-control form-control-sm" id="form-ceo-nm" type="text" maxlength="100" />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label" for="form-tel">전화번호</label>
                        <input class="form-control form-control-sm" id="form-tel" type="text" maxlength="30" />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label" for="form-email">이메일</label>
                        <input class="form-control form-control-sm" id="form-email" type="email" maxlength="200" />
                      </div>
                      <div class="col-12">
                        <label class="form-label">주소</label>
                        <div th:replace="~{fragments/kakao-address-search :: addressFields('company')}"></div>
                      </div>
                      <div class="col-md-4">
                        <label class="form-label" for="form-status-cd">상태</label>
                        <select class="form-select form-select-sm" id="form-status-cd">
                          <option value="ACTIVE">ACTIVE</option>
                          <option value="INACTIVE">INACTIVE</option>
                        </select>
                      </div>
                      <div class="col-md-4">
                        <label class="form-label" for="form-use-yn">사용여부</label>
                        <select class="form-select form-select-sm" id="form-use-yn">
                          <option value="Y">Y</option>
                          <option value="N">N</option>
                        </select>
                      </div>
                      <div class="col-12" id="company-form-primary-host-row">
                        <label class="form-label" for="form-primary-host">대표 접속 도메인</label>
                        <input class="form-control form-control-sm" id="form-primary-host" type="text"
                          placeholder="shop.example.com" maxlength="253" autocomplete="off" />
                        <div class="form-text">신규 등록 시에만 저장됩니다. 이 Host로 접속하면 해당 업체가 자동 선택됩니다.</div>
                      </div>
                      <div class="col-12">
                        <label class="form-label" for="form-memo">비고</label>
                        <textarea class="form-control form-control-sm" id="form-memo" rows="2" maxlength="1000"></textarea>
                      </div>
                    </div>
                  </div>
                  <div class="modal-footer">
                    <button class="btn btn-falcon-default btn-sm" type="button" data-bs-dismiss="modal">취소</button>
                    <button class="btn btn-primary btn-sm" type="submit" id="btn-company-save">저장</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    </th:block>
</body>
</html>
