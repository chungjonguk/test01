<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <th:block th:replace="~{layout :: body}">
    <div th:fragment="page-content">

          <div class="card mb-3">
            <div class="card-header">
              <div class="row flex-between-center g-2">
                <div class="col">
                  <h5 class="mb-1">대시보드 구성</h5>
                  <p class="fs--1 mb-0 text-600">업체별로 홈(<a th:href="@{/}">/</a>) 위젯 표시를 설정합니다. 설정은 DB에 저장되며 선택 업체는 세션에 유지됩니다.</p>
                </div>
                <div class="col-auto d-flex flex-wrap gap-1">
                  <a class="btn btn-falcon-default btn-sm" th:href="@{/}">
                    <span class="fas fa-home me-1"></span>대시보드 미리보기
                  </a>
                </div>
              </div>
            </div>
            <div class="card-body">
              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div th:replace="~{fragments/dashboard-company-select :: companySelect}"></div>
              </div>
              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div class="d-flex flex-wrap align-items-center gap-2">
                  <span class="badge badge-soft-primary fs--1" id="dashboard-config-summary">-</span>
                  <select class="form-select form-select-sm" id="dashboard-config-category" style="max-width:200px" aria-label="카테고리 필터">
                    <option value="">전체 카테고리</option>
                  </select>
                </div>
                <div class="d-flex flex-wrap gap-2">
                  <button type="button" class="btn btn-falcon-default btn-sm" id="btn-dashboard-select-all">전체 표시</button>
                  <button type="button" class="btn btn-falcon-default btn-sm" id="btn-dashboard-select-none">전체 숨김</button>
                  <button type="button" class="btn btn-falcon-default btn-sm" id="btn-reset-dashboard-config">
                    <span class="fas fa-undo me-1"></span>초기화
                  </button>
                  <button type="button" class="btn btn-primary btn-sm" id="btn-save-dashboard-config">
                    <span class="fas fa-save me-1"></span>저장
                  </button>
                </div>
              </div>

              <div id="dashboard-config-layout-message" class="mb-3" aria-live="polite"></div>

              <div class="alert alert-info py-2 fs--1 mb-3" role="note">
                <strong>업체별 자동 배치</strong> — 선택한 업체에 대해 표시(ON) 위젯만 저장되며,
                작은 카드 → 중간 → 넓은 → 전체 순으로 자동 정렬됩니다.
              </div>

              <div class="table-responsive scrollbar">
                <table class="table table-sm table-hover fs--1 mb-0">
                  <thead class="bg-200 text-900">
                    <tr>
                      <th class="text-center ps-3" style="width:56px">배치</th>
                      <th style="width:100px">카테고리</th>
                      <th style="width:140px">위젯 ID</th>
                      <th>표시명</th>
                      <th class="d-none d-lg-table-cell">설명</th>
                      <th class="text-center pe-3" style="width:88px">표시</th>
                    </tr>
                  </thead>
                  <tbody id="dashboard-config-body">
                    <tr>
                      <td colspan="6" class="text-center text-600 py-4">위젯 목록을 불러오는 중...</td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <p class="fs--2 text-600 mb-0 mt-3">
                <strong>배치</strong> 열 번호는 표시된 위젯의 자동 배치 순서입니다. 저장 후
                <a th:href="@{/}">홈 대시보드</a>를 Ctrl+F5로 새로고침하세요.
                카드 <strong>Remove</strong>로 숨긴 위젯도 이 설정과 동일합니다.
              </p>
            </div>
          </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    </th:block>
    <script th:inline="javascript">
      window.__DASHBOARD_WIDGET_CATALOG__ = /*[[${dashboardWidgetCatalog}]]*/ [];
      window.__DASHBOARD_DEFAULT_IDS__ = /*[[${dashboardDefaultIds}]]*/ [];
      window.__DASHBOARD_COMPANY_ID__ = /*[[${dashboardCompanyId}]]*/ null;
      window.__DASHBOARD_LAYOUT_CONFIG__ = /*[[${dashboardLayoutConfig}]]*/ null;
    </script>
</body>
</html>
