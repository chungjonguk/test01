<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <th:block th:replace="~{layout :: body}">
    <div th:fragment="page-content">
        <link th:href="@{/vendors/fullcalendar/main.min.css}" rel="stylesheet" />
        <link th:href="@{/vendors/flatpickr/flatpickr.min.css}" rel="stylesheet" />

        <div class="card overflow-hidden">
            <div class="card-header">
                <div class="row gx-0 align-items-center">
                    <div class="col-auto d-flex justify-content-end order-md-1">
                        <button class="btn icon-item icon-item-sm shadow-none p-0 me-1 ms-md-2" type="button" data-event="prev" data-bs-toggle="tooltip" title="Previous"><span class="fas fa-arrow-left"></span></button>
                        <button class="btn icon-item icon-item-sm shadow-none p-0 me-1 me-lg-2" type="button" data-event="next" data-bs-toggle="tooltip" title="Next"><span class="fas fa-arrow-right"></span></button>
                    </div>
                    <div class="col-auto col-md-auto order-md-2">
                        <h4 class="mb-0 fs-0 fs-sm-1 fs-lg-2 calendar-title"></h4>
                    </div>
                    <div class="col col-md-auto d-flex justify-content-end order-md-3">
                        <button class="btn btn-falcon-primary btn-sm" type="button" data-event="today">Today</button>
                    </div>
                    <div class="col-md-auto d-md-none">
                        <hr />
                    </div>
                    <div class="col-auto d-flex order-md-0">
                        <button class="btn btn-primary btn-sm" type="button" data-bs-toggle="modal" data-bs-target="#addEventModal">
                            <span class="fas fa-plus me-2"></span>일정 추가
                        </button>
                    </div>
                    <div class="col d-flex justify-content-end order-md-2">
                        <div class="dropdown font-sans-serif me-md-2">
                            <button class="btn btn-falcon-default text-600 btn-sm dropdown-toggle dropdown-caret-none" type="button" id="calendar-view-filter" data-bs-toggle="dropdown" data-boundary="viewport" aria-haspopup="true" aria-expanded="false">
                                <span data-view-title="data-view-title">Month View</span><span class="fas fa-sort ms-2 fs--1"></span>
                            </button>
                            <div class="dropdown-menu dropdown-menu-end border py-2" aria-labelledby="calendar-view-filter">
                                <a class="active dropdown-item d-flex justify-content-between" href="#!" data-fc-view="dayGridMonth">Month View<span class="icon-check"><span class="fas fa-check" data-fa-transform="down-4 shrink-4"></span></span></a>
                                <a class="dropdown-item d-flex justify-content-between" href="#!" data-fc-view="timeGridWeek">Week View<span class="icon-check"><span class="fas fa-check" data-fa-transform="down-4 shrink-4"></span></span></a>
                                <a class="dropdown-item d-flex justify-content-between" href="#!" data-fc-view="timeGridDay">Day View<span class="icon-check"><span class="fas fa-check" data-fa-transform="down-4 shrink-4"></span></span></a>
                                <a class="dropdown-item d-flex justify-content-between" href="#!" data-fc-view="listWeek">List View<span class="icon-check"><span class="fas fa-check" data-fa-transform="down-4 shrink-4"></span></span></a>
                                <a class="dropdown-item d-flex justify-content-between" href="#!" data-fc-view="listYear">Year View<span class="icon-check"><span class="fas fa-check" data-fa-transform="down-4 shrink-4"></span></span></a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body p-0 scrollbar">
                <div class="calendar-outline" id="appCalendar"></div>
            </div>
        </div>

        <div class="modal fade" id="eventDetailsModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border"></div>
            </div>
        </div>

        <div class="modal fade" id="addEventModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content border">
                    <form id="addEventForm" autocomplete="off">
                        <div class="modal-header px-card bg-light border-bottom-0">
                            <h5 class="modal-title">일정 만들기</h5>
                            <button class="btn-close me-n1" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body p-card">
                            <div class="mb-3">
                                <label class="fs-0" for="eventTitle">제목</label>
                                <input class="form-control" id="eventTitle" type="text" name="title" required="required" />
                            </div>
                            <div class="mb-3">
                                <label class="fs-0" for="eventStartDate">시작</label>
                                <input class="form-control datetimepicker" id="eventStartDate" type="text" required="required" name="startDate" placeholder="yyyy/mm/dd hh:mm" data-options='{"static":"true","enableTime":"true","dateFormat":"Y-m-d H:i"}' />
                            </div>
                            <div class="mb-3">
                                <label class="fs-0" for="eventEndDate">종료</label>
                                <input class="form-control datetimepicker" id="eventEndDate" type="text" name="endDate" placeholder="yyyy/mm/dd hh:mm" data-options='{"static":"true","enableTime":"true","dateFormat":"Y-m-d H:i"}' />
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="eventAllDay" name="allDay" />
                                <label class="form-check-label" for="eventAllDay">종일</label>
                            </div>
                            <div class="mb-3">
                                <label class="fs-0" for="eventDescription">설명</label>
                                <textarea class="form-control" rows="3" name="description" id="eventDescription"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="fs-0" for="eventLabel">라벨</label>
                                <select class="form-select" id="eventLabel" name="label">
                                    <option value="" selected="selected">없음</option>
                                    <option value="primary">업무</option>
                                    <option value="danger">중요</option>
                                    <option value="success">개인</option>
                                    <option value="warning">필수 참석</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer d-flex justify-content-end align-items-center bg-light border-0">
                            <a class="me-3 text-600" th:href="@{/app/events/create-an-event}">더 많은 옵션</a>
                            <button class="btn btn-primary px-4" type="submit">저장</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    </th:block>
</body>
</html>
