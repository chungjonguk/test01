<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <th:block th:replace="~{layout :: body}">
    <div th:fragment="page-content">
          <div class="row g-3" id="checkoutPageRoot">
            <div class="col-xl-4">
              <div class="card" id="checkout-summary-card">
                <div class="card-header bg-light btn-reveal-trigger d-flex flex-between-center">
                  <h5 class="mb-0">주문 요약</h5>
                  <a class="btn btn-link btn-sm btn-reveal text-600" id="checkout-edit-cart-link" th:href="@{/app/e-commerce/shopping-cart}" title="장바구니 수정">
                    <span class="fas fa-pencil-alt"></span>
                  </a>
                </div>
                <div class="card-body p-0">
                  <div id="checkout-order-empty" class="text-center text-600 py-4 d-none">
                    <p class="mb-2">장바구니가 비어 있습니다.</p>
                    <a class="btn btn-sm btn-primary" th:href="@{/app/e-commerce/shopping-cart}">장바구니로 이동</a>
                  </div>
                  <table class="table table-borderless fs--1 mb-0" id="checkout-order-table">
                    <tbody id="checkout-order-lines"></tbody>
                    <tfoot class="border-top">
                      <tr>
                        <th class="ps-3 py-2">소계</th>
                        <th class="pe-3 py-2 text-end" id="checkout-subtotal-amount">-</th>
                      </tr>
                      <tr>
                        <th class="ps-3 py-2">배송비</th>
                        <th class="pe-3 py-2 text-end" id="checkout-shipping-amount">0원</th>
                      </tr>
                      <tr>
                        <th class="ps-3 pb-3 pt-2">합계</th>
                        <th class="pe-3 pb-3 pt-2 text-end fw-bold" id="checkout-total-amount">-</th>
                      </tr>
                    </tfoot>
                  </table>
                </div>
                <div class="card-footer d-flex justify-content-between bg-light">
                  <div class="fw-semi-bold">결제 금액</div>
                  <div class="fw-bold">
                    <span id="checkout-pay-amount" data-amount="0" data-currency-keep="true">-</span>
                    <span class="fs--2 text-600 d-none" id="checkout-pay-amount-hint">(이니시스 테스트)</span>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-xl-8">
              <div class="card mb-3">
                <div class="card-header bg-light">
                  <div class="row flex-between-center">
                    <div class="col-sm-auto">
                      <h5 class="mb-2 mb-sm-0">배송지</h5>
                    </div>
                    <div class="col-sm-auto"><a class="btn btn-falcon-default btn-sm" href="#!" id="checkout-add-address-btn" role="button"><span class="fas fa-plus me-2" data-fa-transform="shrink-2"></span>배송지 추가</a></div>
                  </div>
                </div>
                <div class="card-body">
                  <div class="row">
                    <div class="col-md-6 mb-3 mb-md-0">
                      <div class="form-check mb-0 custom-radio radio-select">
                        <input class="form-check-input" id="address-1" type="radio" name="clientName" checked="checked" />
                        <label class="form-check-label mb-0 fw-bold d-block" for="address-1">기본 배송지<span class="radio-select-content"><span> 서울시 강남구<br/>테헤란로 123<br/><span class="d-block mb-0 pt-2">010-1234-5678</span></span></span></label>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="card">
                <div class="card-header bg-light">
                  <h5 class="mb-0">결제 (KG이니시스)</h5>
                </div>
                <div class="card-body">
                  <form id="checkout-payment-form">
                    <div class="alert fs--1 mb-4" th:classappend="${inicisUseRealGateway} ? 'alert-success' : 'alert-warning'" role="alert">
                      <strong th:text="${inicisUseRealGateway} ? '이니시스 테스트 연동' : '모의 결제 모드'">이니시스</strong>
                      <span th:if="${inicisUseRealGateway}"> — MID <code th:text="${inicisMid}">INIpayTest</code>, 스테이징 결제창(INIStdPay) 사용</span>
                      <span th:unless="${inicisUseRealGateway}"> — <code>payment.inicis.mock-enabled=false</code> 로 실제 테스트창 활성화</span>
                    </div>
                    <div class="form-check mb-3">
                      <input class="form-check-input" type="radio" id="inicis-card" name="payment-method" checked="checked" />
                      <label class="form-check-label fw-semi-bold" for="inicis-card">신용·체크카드 (이니시스)</label>
                    </div>
                    <div class="rounded-1 p-3 bg-100 mb-4">
                      <div class="text-uppercase fs--2 fw-bold mb-2">We Accept</div>
                      <img th:src="@{/assets/img/icons/icon-payment-methods-grid.png}" alt="" width="160" />
                    </div>
                    <div class="border-bottom border-dashed my-4"></div>
                    <div class="row">
                      <div class="col-md-12 text-center text-md-start">
                        <div class="fs-2 fw-semi-bold mb-2">결제 금액: <span class="text-primary" id="checkout-pay-amount-primary" data-currency-keep="true">-</span></div>
                        <button class="btn btn-success mt-2 px-5" type="submit" id="checkout-confirm-pay-btn" disabled>이니시스 결제하기</button>
                        <p class="fs--1 mt-3 mb-0 text-600">장바구니 상품 금액이 결제 요청에 반영됩니다.</p>
                      </div>
                    </div>
                  </form>
                  <form id="inicis-pay-form" class="d-none" method="post" accept-charset="UTF-8"></form>
                </div>
              </div>
            </div>
          </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    </th:block>
    <script th:inline="javascript">
      window.__CHECKOUT_BUYER__ = {
        name: /*[[${loginUser != null ? loginUser.userName : '테스트구매자'}]]*/ '테스트구매자',
        email: /*[[${loginUser != null ? loginUser.email : 'buyer@printmall.local'}]]*/ 'buyer@printmall.local',
        tel: '01012345678',
        customerId: 1
      };
    </script>
</body>
</html>
