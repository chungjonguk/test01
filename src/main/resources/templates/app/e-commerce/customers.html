<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <th:block th:replace="~{layout :: body}">
    <div th:fragment="page-content">
          <div class="card mb-3" id="customersTable" data-list='{"valueNames":["name","email","phone","address","joined"],"page":10,"pagination":true}'>
            <div class="card-header">
              <div class="row flex-between-center">
                <div class="col-4 col-sm-auto d-flex align-items-center pe-0">
                  <h5 class="fs-0 mb-0 text-nowrap py-2 py-xl-0">Customers</h5>
                </div>
                <div class="col-8 col-sm-auto text-end ps-2">
                  <div class="d-none" id="table-customers-actions">
                    <div class="d-flex">
                      <th:block th:replace="~{fragments/form-controls :: bulkAction('', 'form-select-sm', 'Bulk actions')}"></th:block>
                      <button class="btn btn-falcon-default btn-sm ms-2" type="button">Apply</button>
                    </div>
                  </div>
                  <div id="table-customers-replace-element">
                    <a class="btn btn-falcon-default btn-sm" th:href="@{/app/e-commerce/customer-details}"><span class="fas fa-plus" data-fa-transform="shrink-3 down-2"></span><span class="d-none d-sm-inline-block ms-1">New</span></a>
                    <button class="btn btn-falcon-default btn-sm mx-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#customersFilterOffcanvas" aria-controls="customersFilterOffcanvas"><span class="fas fa-filter" data-fa-transform="shrink-3 down-2"></span><span class="d-none d-sm-inline-block ms-1">Filter</span></button>
                    <button class="btn btn-falcon-default btn-sm" type="button" id="customers-export-btn"><span class="fas fa-external-link-alt" data-fa-transform="shrink-3 down-2"></span><span class="d-none d-sm-inline-block ms-1">Export</span></button>
                  </div>
                </div>
              </div>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive scrollbar">
                <table class="table table-sm table-striped fs--1 mb-0 overflow-hidden">
                  <thead class="bg-200 text-900">
                    <tr>
                      <th>
                        <div class="form-check fs-0 mb-0 d-flex align-items-center">
                          <input class="form-check-input" id="checkbox-bulk-customers-select" type="checkbox" data-bulk-select='{"body":"table-customers-body","actions":"table-customers-actions","replacedElement":"table-customers-replace-element"}' />
                        </div>
                      </th>
                      <th class="sort pe-1 align-middle white-space-nowrap" data-sort="name">Name</th>
                      <th class="sort pe-1 align-middle white-space-nowrap" data-sort="email">Email</th>
                      <th class="sort pe-1 align-middle white-space-nowrap" data-sort="phone">Phone</th>
                      <th class="sort pe-1 align-middle white-space-nowrap ps-5" data-sort="address" style="min-width: 200px;">Billing Address</th>
                      <th class="sort pe-1 align-middle white-space-nowrap" data-sort="joined">Joined</th>
                      <th class="align-middle no-sort"></th>
                    </tr>
                  </thead>
                  <tbody class="list" id="table-customers-body">
                    <tr id="customers-loading-row">
                      <td colspan="7" class="text-center py-4 text-500">고객 목록을 불러오는 중…</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="card-footer d-flex align-items-center justify-content-center">
              <button class="btn btn-sm btn-falcon-default me-1" type="button" title="Previous" data-list-pagination="prev"><span class="fas fa-chevron-left"></span></button>
              <ul class="pagination mb-0"></ul>
              <button class="btn btn-sm btn-falcon-default ms-1" type="button" title="Next" data-list-pagination="next"><span class="fas fa-chevron-right"></span></button>
            </div>
          </div>

          <div class="offcanvas offcanvas-end" id="customersFilterOffcanvas" tabindex="-1" aria-labelledby="customersFilterOffcanvasLabel">
            <div class="offcanvas-header border-bottom">
              <h5 class="offcanvas-title" id="customersFilterOffcanvasLabel">고객 필터</h5>
              <button class="btn-close text-reset" type="button" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
              <div class="mb-3">
                <label class="form-label" for="customer-filter-keyword">검색</label>
                <input class="form-control form-control-sm" id="customer-filter-keyword" type="search" placeholder="이름, 이메일, 전화…" />
              </div>
              <div class="d-grid gap-2">
                <button class="btn btn-primary btn-sm" type="button" id="customer-filter-apply">적용</button>
                <button class="btn btn-falcon-default btn-sm" type="button" id="customer-filter-reset">초기화</button>
              </div>
            </div>
          </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    </th:block>
</body>
</html>
