<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <th:block th:replace="~{layout :: body}">
    <div th:fragment="page-content">

          <div class="card mb-3" id="ordersTable" th:attr="data-list=|{&quot;valueNames&quot;:[&quot;order&quot;,&quot;date&quot;,&quot;address&quot;,&quot;status&quot;,&quot;amount&quot;],&quot;page&quot;:${gridPageSize},&quot;pagination&quot;:{&quot;innerWindow&quot;:2,&quot;left&quot;:1,&quot;right&quot;:1}}|">
            <div class="card-header">
              <div class="row flex-between-center">
                <div class="col-4 col-sm-auto d-flex align-items-center pe-0">
                  <h5 class="fs-0 mb-0 text-nowrap py-2 py-xl-0">Orders</h5>
                </div>
                <div class="col-8 col-sm-auto ms-auto text-end ps-0">
                  <div class="d-none" id="orders-bulk-actions">
                    <div class="d-flex">
                      <th:block th:replace="~{fragments/form-controls :: bulkAction('', 'form-select-sm', 'Bulk actions')}"></th:block>
                      <button class="btn btn-falcon-default btn-sm ms-2" type="button" id="orders-bulk-apply-btn">Apply</button>
                    </div>
                  </div>
                  <div id="orders-actions">
                    <a class="btn btn-falcon-default btn-sm" th:href="@{/app/e-commerce/orders/order-details}"><span class="fas fa-plus" data-fa-transform="shrink-3 down-2"></span><span class="d-none d-sm-inline-block ms-1">New</span></a>
                    <button class="btn btn-falcon-default btn-sm mx-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#ordersFilterOffcanvas" aria-controls="ordersFilterOffcanvas"><span class="fas fa-filter" data-fa-transform="shrink-3 down-2"></span><span class="d-none d-sm-inline-block ms-1">Filter</span></button>
                    <button class="btn btn-falcon-default btn-sm" type="button" id="order-export-btn"><span class="fas fa-external-link-alt" data-fa-transform="shrink-3 down-2"></span><span class="d-none d-sm-inline-block ms-1">Export</span></button>
                  </div>
                </div>
              </div>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive scrollbar">
                <table class="table table-sm table-striped fs--1 mb-0">
                  <thead class="bg-200 text-900">
                    <tr>
                      <th>
                        <div class="form-check fs-0 mb-0 d-flex align-items-center">
                          <input class="form-check-input" id="checkbox-bulk-orders-select" type="checkbox" data-bulk-select='{"body":"table-orders-body","actions":"orders-bulk-actions","replacedElement":"orders-actions"}' />
                        </div>
                      </th>
                      <th class="sort pe-1 align-middle white-space-nowrap" data-sort="order">Order</th>
                      <th class="sort pe-1 align-middle white-space-nowrap pe-7" data-sort="date">Date</th>
                      <th class="sort pe-1 align-middle white-space-nowrap" data-sort="address" style="min-width: 12.5rem;">Ship To</th>
                      <th class="sort pe-1 align-middle white-space-nowrap text-center" data-sort="status">Status</th>
                      <th class="sort pe-1 align-middle white-space-nowrap text-end" data-sort="amount">Amount</th>
                      <th class="no-sort"></th>
                    </tr>
                  </thead>
                  <tbody class="list" id="table-orders-body">
                    <tr id="orders-loading-row">
                      <td colspan="7" class="text-center py-4 text-500">주문 목록을 불러오는 중…</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="card-footer">
              <div class="d-flex align-items-center justify-content-center">
                <button class="btn btn-sm btn-falcon-default me-1" type="button" title="Previous" data-list-pagination="prev"><span class="fas fa-chevron-left"></span></button>
                <ul class="pagination mb-0"></ul>
                <button class="btn btn-sm btn-falcon-default ms-1" type="button" title="Next" data-list-pagination="next"><span class="fas fa-chevron-right">             </span></button>
              </div>
            </div>
          </div>

          <div class="offcanvas offcanvas-end" id="ordersFilterOffcanvas" tabindex="-1" aria-labelledby="ordersFilterOffcanvasLabel">
            <div class="offcanvas-header border-bottom">
              <h5 class="offcanvas-title" id="ordersFilterOffcanvasLabel">주문 필터</h5>
              <button class="btn-close text-reset" type="button" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
              <div class="mb-3">
                <label class="form-label" for="order-filter-keyword">검색</label>
                <input class="form-control form-control-sm" id="order-filter-keyword" type="search" placeholder="주문번호, 고객명, 이메일…" />
              </div>
              <div class="mb-3">
                <label class="form-label" for="order-filter-status">상태</label>
                <select class="form-select form-select-sm" id="order-filter-status">
                  <th:block th:replace="~{fragments/code-select :: optionsByGroup('ORDER_STATUS_FILTER', '')}"></th:block>
                </select>
              </div>
              <div class="d-grid gap-2">
                <button class="btn btn-primary btn-sm" type="button" id="order-filter-apply">적용</button>
                <button class="btn btn-falcon-default btn-sm" type="button" id="order-filter-reset">초기화</button>
              </div>
            </div>
          </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    </th:block>
</body>
</html>
