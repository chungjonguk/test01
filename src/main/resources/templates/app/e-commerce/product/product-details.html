<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <th:block th:replace="~{layout :: body}">
    <div th:fragment="page-content">

          <div class="card mb-3" th:if="${product != null}" id="product-detail-db">
            <div class="card-body">
              <div class="row flex-between-center mb-3">
                <div class="col">
                  <a class="btn btn-falcon-default btn-sm" th:href="@{/app/e-commerce/product/product-manage}">
                    <span class="fas fa-arrow-left me-1"></span>상품 관리
                  </a>
                  <a class="btn btn-falcon-default btn-sm ms-1" th:href="${imagesUrl}">
                    <span class="fas fa-images me-1"></span>이미지 전체
                  </a>
                  <a class="btn btn-falcon-default btn-sm ms-1" th:href="${editUrl}"><span class="fas fa-edit me-1"></span>수정</a>
                </div>
                <div class="col-auto">
                  <span class="badge badge-soft-primary">ID <span th:text="${product.productId}">1</span></span>
                  <span class="badge badge-soft-info ms-1" th:text="${#lists.size(displayImageUrls)} + '장'">0장</span>
                </div>
              </div>
              <div class="row">
                <div class="col-lg-6 mb-4 mb-lg-0">
                  <div class="product-details-gallery border rounded-1 p-2 bg-light" th:if="${!displayImageUrls.isEmpty()}">
                    <div class="product-slider" id="galleryTop" th:if="${#lists.size(displayImageUrls) > 1}">
                      <div class="swiper-container theme-slider" data-swiper='{"spaceBetween":8,"loop":true,"navigation":{"nextEl":".swiper-button-next","prevEl":".swiper-button-prev"}}'>
                        <div class="swiper-wrapper">
                          <div class="swiper-slide" th:each="url : ${displayImageUrls}">
                            <img class="rounded-1 w-100 product-details-main-img" th:src="${url}" th:alt="${product.productNm}" style="max-height:420px;object-fit:contain" />
                          </div>
                        </div>
                        <div class="swiper-nav">
                          <div class="swiper-button-next swiper-button-white"></div>
                          <div class="swiper-button-prev swiper-button-white"></div>
                        </div>
                      </div>
                    </div>
                    <img th:if="${#lists.size(displayImageUrls) <= 1}" class="rounded-1 w-100 product-details-main-img"
                         th:src="${displayImgUrl}" th:alt="${product.productNm}" style="max-height:420px;object-fit:contain" />
                    <div class="d-flex flex-wrap gap-2 mt-2 justify-content-center">
                      <img th:each="url : ${displayImageUrls}" th:src="${url}" alt=""
                           class="rounded-1 border" style="width:64px;height:64px;object-fit:cover" />
                    </div>
                  </div>
                  <p class="fs--2 text-500 mb-0 mt-2" th:if="${displayImageUrls.isEmpty()}">등록된 이미지가 없습니다.</p>
                </div>
                <div class="col-lg-6">
                  <h5 th:text="${product.productNm}">상품명</h5>
                  <p class="fs--1 mb-2">
                    <span class="text-600">카테고리: </span><strong th:text="${product.categoryCd}">—</strong>
                    <span class="mx-2">|</span>
                    <span class="text-600">상태: </span><strong th:text="${product.statusCd}">—</strong>
                  </p>
                  <h4 class="text-warning mb-2">
                    <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + '원'">0원</span>
                  </h4>
                  <p class="fs--1 mb-1"><span>재고: </span><strong th:text="${product.stockQty}">0</strong>개</p>
                  <div class="border-top pt-3 mt-3">
                    <h6 class="mb-2">상품 설명</h6>
                    <p class="mb-0" th:if="${product.description != null and !#strings.isEmpty(product.description)}"
                       th:text="${product.description}" style="white-space:pre-wrap">—</p>
                    <p class="mb-0 text-600" th:unless="${product.description != null and !#strings.isEmpty(product.description)}">설명 없음</p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="card mb-3" th:if="${productNotFound}">
            <div class="card-body text-center py-5">
              <p class="text-danger mb-2">상품을 찾을 수 없습니다.</p>
              <a class="btn btn-primary btn-sm" th:href="@{/app/e-commerce/product/product-manage}">상품 관리</a>
            </div>
          </div>

          <div class="card mb-3" th:if="${demoMode}">
            <div class="card-body">
              <p class="alert alert-info fs--1">데모 화면 — <a th:href="@{/app/e-commerce/product/product-register}">상품 등록</a> 후 관리 목록에서 확인하세요.</p>
            </div>
          </div>

          <div class="card mb-3 d-none" id="product-detail-api-shell"
               th:attr="data-api-base=@{/api/ecommerce/products},
                        data-images-base=@{/app/e-commerce/product/product-images}">
            <div class="card-body" id="product-detail-api-body"></div>
          </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    </th:block>
    <script>
      (function () {
        function boot() {
          if (typeof window.ProductDetailsInit === 'function') {
            window.ProductDetailsInit();
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', boot);
        } else {
          boot();
        }
      })();
    </script>
</body>
</html>
