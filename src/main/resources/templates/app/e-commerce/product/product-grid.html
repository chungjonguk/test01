<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <th:block th:replace="~{layout :: body}">
    <div th:fragment="page-content">

          <div th:if="${storefrontMode}" th:replace="~{fragments/storefront-header :: storefrontHeader}"></div>

          <div class="card mb-3" id="store-product-grid-shell"
               th:attr="data-storefront=${storefrontMode != null and storefrontMode ? 'true' : 'false'}">
            <div class="card-body">
              <div class="row flex-between-center mb-3">
                <div class="col-sm-auto">
                  <h6 class="mb-0" id="store-product-count">Products</h6>
                </div>
                <div class="col-sm-auto" th:if="${storefrontMode == null or !storefrontMode}">
                  <a class="btn btn-falcon-default btn-sm" th:href="@{/app/e-commerce/product/product-manage}">
                    <span class="fas fa-cog me-1"></span>상품 관리
                  </a>
                </div>
              </div>
              <div class="row" id="store-product-grid">
                <div class="col-12 text-center text-600 py-5">상품을 불러오는 중...</div>
              </div>
            </div>
          </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    </th:block>
</body>
</html>
