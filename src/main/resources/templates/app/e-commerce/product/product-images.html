<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <th:block th:replace="~{layout :: body}">
    <div th:fragment="page-content">

          <div class="card mb-3" th:if="${missingId}">
            <div class="card-body text-center py-5">
              <p class="text-600">상품 ID가 필요합니다. <code>?id=상품ID</code></p>
              <a class="btn btn-primary btn-sm" th:href="@{/app/e-commerce/product/product-manage}">상품 관리</a>
            </div>
          </div>

          <div class="card mb-3" th:if="${productNotFound}">
            <div class="card-body text-center py-5">
              <p class="text-danger">상품을 찾을 수 없습니다. (ID: <span th:text="${requestedProductId}"></span>)</p>
              <a class="btn btn-primary btn-sm" th:href="@{/app/e-commerce/product/product-manage}">상품 관리</a>
            </div>
          </div>

          <div class="card mb-3" th:if="${product != null}" id="product-images-page">
            <div class="card-header">
              <div class="row flex-between-center g-2">
                <div class="col">
                  <h5 class="mb-0" th:text="${product.productNm} + ' — 이미지'">상품 이미지</h5>
                  <p class="fs--1 mb-0 text-600">
                    등록 이미지 <span th:text="${#lists.size(displayImageUrls)}">0</span> / 5
                  </p>
                </div>
                <div class="col-auto d-flex flex-wrap gap-1">
                  <a class="btn btn-falcon-default btn-sm" th:href="${detailUrl}"><span class="fas fa-info-circle me-1"></span>상세</a>
                  <a class="btn btn-falcon-default btn-sm" th:href="${editUrl}"><span class="fas fa-edit me-1"></span>수정</a>
                  <a class="btn btn-falcon-default btn-sm" th:href="@{/app/e-commerce/product/product-manage}">목록</a>
                </div>
              </div>
            </div>
            <div class="card-body">
              <div class="row g-3" th:if="${!displayImageUrls.isEmpty()}">
                <div class="col-12">
                  <div class="border rounded-1 p-3 bg-light text-center">
                    <img id="product-images-main" class="rounded-1" style="max-height:480px;max-width:100%;object-fit:contain"
                         th:src="${displayImageUrls[0]}" th:alt="${product.productNm}" />
                  </div>
                </div>
                <div class="col-12">
                  <div class="d-flex flex-wrap gap-2 justify-content-center" id="product-images-thumbs">
                    <button type="button" class="btn p-0 border product-image-thumb-btn position-relative"
                            th:each="url, stat : ${displayImageUrls}"
                            th:attr="data-url=${url},data-index=${stat.index},
                                     data-main=${mainImageUrl != null and mainImageUrl == url}">
                      <img class="rounded-1" th:src="${url}" alt="" style="width:96px;height:96px;object-fit:cover" />
                      <span class="badge bg-warning text-dark position-absolute top-0 start-0 m-1 fs--2"
                            th:if="${mainImageUrl != null and mainImageUrl == url}">대표</span>
                    </button>
                  </div>
                </div>
                <div class="col-12">
                  <h6 class="mb-2">등록된 이미지 URL</h6>
                  <ul class="list-group list-group-flush fs--1">
                    <li class="list-group-item px-0" th:each="url, stat : ${displayImageUrls}">
                      <span class="badge badge-soft-primary me-2" th:text="${stat.index + 1}">1</span>
                      <span class="badge bg-warning text-dark me-2" th:if="${mainImageUrl != null and mainImageUrl == url}">대표</span>
                      <code class="text-break" th:text="${url}"></code>
                    </li>
                  </ul>
                </div>
              </div>
              <div class="text-center py-5 text-600" th:if="${displayImageUrls.isEmpty()}">
                등록된 이미지가 없습니다.
                <a th:href="${editUrl}">상품 수정</a>에서 이미지를 추가하세요.
              </div>
            </div>
          </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    </th:block>
    <script>
      (function () {
        document.querySelectorAll('.product-image-thumb-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var url = btn.getAttribute('data-url');
            var main = document.getElementById('product-images-main');
            if (main && url) {
              main.src = url;
            }
            document.querySelectorAll('.product-image-thumb-btn').forEach(function (b) {
              b.classList.remove('border-primary', 'border-2');
            });
            btn.classList.add('border-primary', 'border-2');
          });
        });
        var mainBtn = document.querySelector('.product-image-thumb-btn[data-main="true"]');
        var first = mainBtn || document.querySelector('.product-image-thumb-btn');
        if (first) {
          first.classList.add('border-primary', 'border-2');
        }
      })();
    </script>
</body>
</html>
