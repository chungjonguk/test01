<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <th:block th:replace="~{layout :: body}">
    <div th:fragment="page-content">

          <div class="card mb-3">
            <div class="card-body">
              <div class="row flex-between-center g-2">
                <div class="col">
                  <h5 class="mb-1" th:text="${editMode} ? '상품 수정' : '상품 등록'">상품 등록</h5>
                  <p class="fs--1 mb-0 text-600">상품 이미지 최대 <span th:text="${maxImages}">5</span>개 · URL 또는 파일 업로드 · <span class="fas fa-star text-warning"></span> 대표 이미지 선택</p>
                </div>
                <div class="col-auto d-flex flex-wrap gap-1">
                  <a class="btn btn-falcon-default btn-sm" th:href="@{/app/e-commerce/product/product-manage}">
                    <span class="fas fa-list me-1"></span>상품 관리
                  </a>
                  <a class="btn btn-falcon-default btn-sm" th:if="${imagesPreviewUrl != null}" th:href="${imagesPreviewUrl}" target="_blank">
                    <span class="fas fa-images me-1"></span>이미지 보기
                  </a>
                </div>
              </div>
            </div>
          </div>

          <div class="card mb-3">
            <div class="card-header">
              <h5 class="mb-0">상품 정보</h5>
            </div>
            <div class="card-body bg-light">
              <form id="product-register-form" class="row g-3"
                    th:attr="data-api-base=@{/api/ecommerce/products},
                             data-edit-mode=${editMode},
                             data-product-id=${productForm.productId},
                             data-max-images=${maxImages},
                             data-manage-url=@{/app/e-commerce/product/product-manage},
                             data-images-url=@{/app/e-commerce/product/product-images}">
                <input type="hidden" id="product-id" th:value="${productForm.productId}" />

                <div class="col-12">
                  <label class="form-label" for="product-nm">상품명 <span class="text-danger">*</span></label>
                  <input class="form-control" id="product-nm" type="text" required maxlength="200"
                         th:value="${productForm.productNm}" placeholder="예: Apple Watch Series 4" />
                </div>

                <div class="col-md-6">
                  <label class="form-label" for="category-cd">카테고리 <span class="text-danger">*</span></label>
                  <select class="form-select" id="category-cd" required>
                    <th:block th:replace="~{fragments/code-select :: optionsByGroup('PRODUCT_CATEGORY', ${productForm.categoryCd})}"></th:block>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label" for="status-cd">판매 상태 <span class="text-danger">*</span></label>
                  <select class="form-select" id="status-cd" required>
                    <th:block th:replace="~{fragments/code-select :: optionsByGroup('PRODUCT_STATUS', ${productForm.statusCd})}"></th:block>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label" for="price">가격(원) <span class="text-danger">*</span></label>
                  <input class="form-control" id="price" type="number" min="0" step="0.01" required
                         th:value="${productForm.price}" placeholder="0" />
                </div>

                <div class="col-md-6">
                  <label class="form-label" for="stock-qty">재고 수량 <span class="text-danger">*</span></label>
                  <input class="form-control" id="stock-qty" type="number" min="0" step="1" required
                         th:value="${productForm.stockQty}" />
                </div>

                <div class="col-12">
                  <label class="form-label" for="description">상품 설명</label>
                  <textarea class="form-control" id="description" rows="4" maxlength="5000"
                            th:text="${productForm.description}" placeholder="상품 상세 설명"></textarea>
                </div>

                <div class="col-12 product-register-images-section">
                  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 border-top pt-3 mt-1 mb-3">
                    <h6 class="mb-0">상품 이미지 <span class="text-danger">*</span> <span class="fs--1 text-600 fw-normal">(1~5개)</span></h6>
                    <button type="button" class="btn btn-falcon-default btn-sm" id="btn-add-image-slot" disabled>
                      <span class="fas fa-plus me-1"></span>이미지 추가
                    </button>
                  </div>
                  <div id="product-image-slots" class="row g-3 align-items-end"
                       th:attr="data-max=${maxImages},
                                data-upload-url=@{/api/ecommerce/products/upload-image}"></div>
                  <p class="fs--2 text-600 mb-0 mt-2" id="product-image-count-hint">0 / 5 등록됨</p>
                </div>

                <div class="col-12">
                  <div id="product-form-message" class="alert d-none mb-0" role="alert"></div>
                </div>

                <div class="col-12 d-flex flex-wrap gap-2">
                  <button class="btn btn-primary" type="submit" id="btn-save-product">
                    <span class="fas fa-save me-1"></span>
                    <span th:text="${editMode} ? '수정 저장' : '등록'">등록</span>
                  </button>
                  <a class="btn btn-falcon-default" th:if="${detailPreviewUrl != null}" th:href="${detailPreviewUrl}" target="_blank">
                    <span class="fas fa-eye me-1"></span>상세 화면
                  </a>
                  <a class="btn btn-falcon-default" th:href="@{/app/e-commerce/product/product-manage}">취소</a>
                </div>
              </form>
            </div>
          </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    </th:block>
    <script th:inline="javascript">
      window.__INITIAL_PRODUCT_IMAGES__ = /*[[${initialImageUrls}]]*/ [];
      window.__INITIAL_MAIN_IMAGE_URL__ = /*[[${initialMainImageUrl}]]*/ '';
    </script>
    <script>
      (function () {
        function boot() {
          if (typeof window.ProductRegisterInit === 'function') {
            window.ProductRegisterInit();
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', boot);
        } else {
          boot();
        }
      })();
    </script>
</body>
</html>
