<!DOCTYPE html>

<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">

</head>

<body>

    <th:block th:replace="~{layout :: body}">

    <div th:fragment="page-content">

          <style>

            #shoppingCartCard .cart-grid-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

            #shoppingCartCard .cart-grid-row {

              display: grid;

              grid-template-columns: 2.25rem minmax(8rem, 1fr) 5.5rem 7rem 7.5rem 3rem;

              align-items: center;

              column-gap: 0.75rem;

              padding-left: 1rem;

              padding-right: 1rem;

              margin-left: 0;

              margin-right: 0;

            }

            #shoppingCartCard .cart-cell-product { min-width: 0; }

            #shoppingCartCard .cart-cell-product h5 {

              overflow: hidden;

              text-overflow: ellipsis;

              display: -webkit-box;

              -webkit-line-clamp: 2;

              -webkit-box-orient: vertical;

            }

            @media (max-width: 767.98px) {

              #shoppingCartCard .cart-grid-row { min-width: 32rem; }

            }

          </style>

          <div class="card mb-3" id="shoppingCartCard">

            <div class="card-header">

              <div class="row flex-between-center g-2">

                <div class="col-md-auto">

                  <h5 class="mb-0" id="cart-title-count">장바구니</h5>

                </div>

                <div class="col-md-auto">

                  <div class="d-flex flex-wrap gap-2">

                    <button type="button" class="btn btn-sm btn-danger" id="btn-cart-delete-selected" disabled title="선택한 상품 삭제">

                      <span class="fas fa-trash-alt me-1"></span>선택 삭제

                    </button>

                    <button type="button" class="btn btn-sm btn-outline-danger" id="btn-cart-clear-all" title="전체 삭제">

                      <span class="fas fa-trash-alt me-1"></span>전체 삭제

                    </button>

                    <a class="btn btn-sm btn-outline-secondary border-300 shadow-none" th:href="@{/app/e-commerce/product/product-list}">

                      <span class="fas fa-chevron-left me-1"></span>쇼핑 계속

                    </a>

                    <a class="btn btn-sm btn-primary" id="cart-checkout-btn" th:href="@{/app/e-commerce/checkout}">결제하기</a>

                  </div>

                </div>

              </div>

            </div>

            <div class="card-body p-0 cart-grid-scroll">

              <div class="cart-grid-row bg-200 text-900 fs--1 fw-semi-bold cart-grid-header">

                <div class="cart-cell-check py-2">

                  <input class="form-check-input" type="checkbox" id="cart-select-all" title="전체 선택" aria-label="전체 선택"/>

                </div>

                <div class="cart-cell-product py-2">상품</div>

                <div class="cart-cell-unit py-2 text-end">단가</div>

                <div class="cart-cell-qty py-2 text-center">수량</div>

                <div class="cart-cell-subtotal py-2 text-end">소계</div>

                <div class="cart-cell-action py-2 text-center">삭제</div>

              </div>

              <div id="cart-item-list"></div>

              <div id="cart-empty" class="text-center text-600 py-5 d-none">

                <span class="fas fa-shopping-cart fa-2x mb-3 d-block text-300"></span>

                <p class="mb-2">장바구니가 비어 있습니다.</p>

                <a class="btn btn-sm btn-primary" th:href="@{/app/e-commerce/product/product-list}">상품 보러 가기</a>

              </div>

              <div class="cart-grid-row fw-bold border-top border-200" id="cart-summary">

                <div class="cart-cell-check py-3"></div>

                <div class="cart-cell-product py-3 text-end text-900">합계</div>

                <div class="cart-cell-unit py-3 text-end text-600">-</div>

                <div class="cart-cell-qty py-3 text-center fs--1 text-600" id="cart-total-count">0건</div>

                <div class="cart-cell-subtotal py-3 text-end">

                  <div class="fs-0" id="cart-total-price">-</div>

                </div>

                <div class="cart-cell-action py-3"></div>

              </div>

            </div>

            <div class="card-footer bg-light d-flex flex-wrap justify-content-between align-items-center gap-2">

              <form class="me-md-3" id="cart-promo-form">

                <div class="input-group input-group-sm">

                  <input class="form-control" id="cart-promo-code" type="text" placeholder="프로모 코드" autocomplete="off" />

                  <button class="btn btn-outline-secondary border-300 btn-sm shadow-none" type="submit" id="cart-promo-apply-btn">적용</button>

                </div>

              </form>

              <a class="btn btn-sm btn-primary" th:href="@{/app/e-commerce/checkout}">결제하기</a>

            </div>

          </div>

        <div th:replace="~{fragments/footer :: footer}"></div>

    </div>

    </th:block>

</body>

</html>
