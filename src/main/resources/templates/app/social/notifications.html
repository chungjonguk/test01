<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <th:block th:replace="~{layout :: body}">
    <div th:fragment="page-content">

            <div class="card mb-3" id="notificationsPageCard">
              <div class="card-header bg-light">
                <div class="row flex-between-center">
                  <div class="col-sm-auto">
                    <h5 class="mb-1 mb-md-0" id="notification-page-title">알림</h5>
                  </div>
                  <div class="col-sm-auto fs--1">
                    <a class="font-sans-serif ms-2 ms-sm-3" href="#!" data-notification-mark-all="true">모두 읽음</a>
                  </div>
                </div>
              </div>
              <div class="card-body fs--1 p-0" id="notification-page-list"></div>
            </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    </th:block>
</body>
</html>
