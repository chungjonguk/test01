<!DOCTYPE html>
<html lang="ko" dir="ltr" data-navbar-position="vertical" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <th:block th:replace="~{layout :: body}">
    <div th:fragment="page-content">
        <div class="mb-3">
            <h2 class="mb-1">Dashboard</h2>
            <p class="text-700">Welcome to your dashboard</p>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6 col-xxl-3">
                <div class="card h-md-100 ecommerce-card-min-width" data-dashboard-widget="weekly-sales">
                    <div class="card-header d-flex flex-between-center pb-0">
                        <h6 class="mb-0 mt-2 d-flex align-items-center">Weekly Sales<span class="ms-1 text-400" data-bs-toggle="tooltip" data-bs-placement="top" title="Calculated according to last week's sales"><span class="far fa-question-circle" data-fa-transform="shrink-1"></span></span></h6>
                        <div class="dropdown font-sans-serif btn-reveal-trigger">
                            <button class="btn btn-link text-600 btn-sm dropdown-toggle dropdown-caret-none btn-reveal" type="button" id="dropdown-weekly-sales" data-bs-toggle="dropdown" data-boundary="viewport" aria-haspopup="true" aria-expanded="false"><span class="fas fa-ellipsis-h fs--2"></span></button>
                            <div class="dropdown-menu dropdown-menu-end border py-2" aria-labelledby="dropdown-weekly-sales">
                                <a class="dropdown-item" href="#!">View</a>
                                <a class="dropdown-item" href="#!">Export</a>
                                <div class="dropdown-divider"></div>
                                <a class="dropdown-item text-danger" href="#!" role="button" data-widget-action="remove">Remove</a>
                            </div>
                        </div>
                    </div>
                    <div class="card-body d-flex flex-column justify-content-end">
                        <div class="row">
                            <div class="col">
                                <p class="font-sans-serif lh-1 mb-1 fs-4">$47K</p>
                                <span class="badge badge-soft-success rounded-pill fs--2">+3.5%</span>
                            </div>
                            <div class="col-auto ps-0">
                                <div class="echart-bar-weekly-sales h-100"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-xxl-3">
                <div class="card h-md-100" data-dashboard-widget="total-order">
                    <div class="card-header d-flex flex-between-center pb-0">
                        <h6 class="mb-0 mt-2">Total Order</h6>
                        <div th:replace="~{fragments/widget-actions :: widgetMenu('total-order')}"></div>
                    </div>
                    <div class="card-body d-flex flex-column justify-content-end">
                        <div class="row justify-content-between">
                            <div class="col-auto align-self-end">
                                <div class="fs-4 fw-normal font-sans-serif text-700 lh-1 mb-1">58.4K</div>
                                <span class="badge rounded-pill fs--2 bg-200 text-primary"><span class="fas fa-caret-up me-1"></span>13.6%</span>
                            </div>
                            <div class="col-auto ps-0 mt-n4">
                                <div class="echart-default-total-order" data-echarts='{"tooltip":{"trigger":"axis","formatter":"{b0} : {c0}"},"xAxis":{"data":["Week 4","Week 5","Week 6","Week 7"]},"series":[{"type":"line","data":[20,40,100,120],"smooth":true,"lineStyle":{"width":3}}],"grid":{"bottom":"2%","top":"2%","right":"10px","left":"10px"}}' data-echart-responsive="true"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-xxl-3">
                <div class="card h-md-100" data-dashboard-widget="market-share">
                    <div class="card-header d-flex flex-between-center pb-0">
                        <h6 class="mb-0">Market Share</h6>
                        <div th:replace="~{fragments/widget-actions :: widgetMenu('market-share')}"></div>
                    </div>
                    <div class="card-body pt-2">
                        <div class="row h-100 justify-content-between g-0">
                            <div class="col-5 col-sm-6 col-xxl pe-2">
                                <div class="fs--2 mt-3">
                                    <div class="d-flex flex-between-center mb-1">
                                        <div class="d-flex align-items-center"><span class="dot bg-primary"></span><span class="fw-semi-bold">Samsung</span></div>
                                        <div class="d-xxl-none">33%</div>
                                    </div>
                                    <div class="d-flex flex-between-center mb-1">
                                        <div class="d-flex align-items-center"><span class="dot bg-info"></span><span class="fw-semi-bold">Huawei</span></div>
                                        <div class="d-xxl-none">29%</div>
                                    </div>
                                    <div class="d-flex flex-between-center mb-1">
                                        <div class="d-flex align-items-center"><span class="dot bg-warning"></span><span class="fw-semi-bold">Apple</span></div>
                                        <div class="d-xxl-none">20%</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-auto position-relative">
                                <div class="echart-market-share" data-echart-responsive="true"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-xxl-3">
                <div class="card h-md-100" data-dashboard-widget="new-users">
                    <div class="card-header d-flex flex-between-center pb-0">
                        <h6 class="mb-0 mt-2">New Users</h6>
                        <div th:replace="~{fragments/widget-actions :: widgetMenu('new-users')}"></div>
                    </div>
                    <div class="card-body d-flex flex-column justify-content-end">
                        <div class="row justify-content-between">
                            <div class="col-auto align-self-end">
                                <div class="fs-4 fw-normal font-sans-serif text-700 lh-1 mb-1">12.6K</div>
                                <span class="badge rounded-pill fs--2 bg-200 text-success"><span class="fas fa-caret-up me-1"></span>18.2%</span>
                            </div>
                            <div class="col-auto ps-0 mt-n4">
                                <div class="echart-new-users" data-echart-responsive="true"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card mb-3" data-dashboard-widget="dashboard-summary">
            <div class="card-header d-flex flex-between-center">
                <h5 class="mb-0">대시보드</h5>
                <div th:replace="~{fragments/widget-actions :: widgetMenu('dashboard-summary')}"></div>
            </div>
            <div class="card-body">
                <p>전체 현황을 한눈에 확인하세요</p>
            </div>
        </div>
    </div>
    </th:block>
</body>
</html>
