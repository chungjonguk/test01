<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="bar">
        <style>
          #app-global-loading-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 11000;
            height: 4px;
            margin: 0;
            border-radius: 0;
            pointer-events: none;
          }
          html.app-is-loading { cursor: progress; }
        </style>
        <div id="app-global-loading-bar" class="progress rounded-0 d-none" role="progressbar" aria-label="로딩 중" aria-hidden="true">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary w-100"></div>
        </div>
    </th:block>
    <th:block th:fragment="scripts">
        <script th:src="@{/assets/js/app-loading.js(v=1)}"></script>
    </th:block>
    <th:block th:fragment="scriptsWithSwal">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
        <script th:src="@{/assets/js/app-loading.js(v=1)}"></script>
    </th:block>
</body>
</html>
