<!-- 카카오 주소 검색 + 지도 + 우편번호/기본/상세 (공통) -->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="searchPanel(queryId, btnId, resultsId, hintId)">
  <div class="mb-2 kakao-address-search-panel">
    <label class="form-label fs--1 mb-1" th:for="${queryId}">주소 검색 (카카오)</label>
    <div class="input-group input-group-sm">
      <input class="form-control" type="search" th:id="${queryId}"
             placeholder="도로명·지번·건물명 (예: 테헤란로 152)" autocomplete="off" />
      <button class="btn btn-primary" type="button" th:id="${btnId}">
        <span class="fas fa-search me-1"></span>검색
      </button>
    </div>
    <div class="list-group mt-2 d-none" th:id="${resultsId}" role="listbox" aria-label="주소 검색 결과"></div>
    <div class="alert alert-warning py-2 px-3 mt-2 mb-0 fs--1 d-none" th:id="${hintId}" role="alert"></div>
    <div class="form-text">카카오 로컬 API · 검색 후 목록에서 주소를 선택하세요.</div>
  </div>
</th:block>

<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="mapPanel(wrapId, mapId, statusId, infoId)">
  <div class="kakao-address-map-wrap d-none mb-2" th:id="${wrapId}" aria-hidden="true">
    <label class="form-label fs--1 mb-1">카카오맵</label>
    <div class="kakao-address-map rounded border bg-100" th:id="${mapId}" role="img" aria-label="선택 주소 지도"></div>
    <div class="fs--2 text-600 mt-1" th:id="${infoId}" aria-live="polite"></div>
    <div class="alert alert-secondary py-2 px-3 mt-2 mb-0 fs--1 d-none" th:id="${statusId}" role="status"></div>
  </div>
</th:block>

<!--
  통합 주소 폼 — idPrefix 기준으로 element id 자동 생성
  예: idPrefix=company → company-address-search-query, company-address-zip …
  JS: PrintMallKakaoAddressForm.create({ idPrefix: 'company' })
-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="addressFields(idPrefix)">
  <div class="alert alert-info py-2 fs--1 mb-2" th:if="${kakaoAddressUsesMock}" role="status">
    <strong>데모 주소 모드</strong> — 실제 카카오 검색을 쓰려면
    <code>application-local.properties</code>의 <code>kakao.client-id</code>(REST API 키) 설정 후 서버 재시작.
    (<a href="https://developers.kakao.com" target="_blank" rel="noopener">developers.kakao.com</a>)
  </div>
  <div th:replace="~{fragments/kakao-address-search :: searchPanel(
    |${idPrefix}-address-search-query|,
    |${idPrefix}-address-search-btn|,
    |${idPrefix}-address-search-results|,
    |${idPrefix}-address-search-hint|)}"></div>
  <div th:replace="~{fragments/kakao-address-search :: mapPanel(
    |${idPrefix}-kakao-map-wrap|,
    |${idPrefix}-kakao-map|,
    |${idPrefix}-kakao-map-status|,
    |${idPrefix}-kakao-map-info|)}"></div>
  <div class="row g-2">
    <div class="col-md-3">
      <label class="form-label fs--1 mb-1" th:for="|${idPrefix}-address-zip|">우편번호</label>
      <input class="form-control form-control-sm bg-100" type="text"
        th:id="|${idPrefix}-address-zip|" placeholder="검색 후 자동 입력" maxlength="5"
        readonly="readonly" tabindex="-1" autocomplete="postal-code" />
    </div>
    <div class="col-md-9">
      <label class="form-label fs--1 mb-1" th:for="|${idPrefix}-address-base|">기본 주소</label>
      <input class="form-control form-control-sm bg-100" type="text"
        th:id="|${idPrefix}-address-base|" placeholder="주소 검색 후 자동 입력"
        readonly="readonly" tabindex="-1" autocomplete="street-address" />
    </div>
    <div class="col-12">
      <label class="form-label fs--1 mb-1" th:for="|${idPrefix}-address-detail|">상세 주소</label>
      <input class="form-control form-control-sm" type="text"
        th:id="|${idPrefix}-address-detail|" maxlength="200"
        placeholder="동·호수 등 상세 주소 (직접 입력)" autocomplete="address-line2" />
    </div>
  </div>
  <div class="form-text mb-0">우편번호·기본 주소는 카카오 검색 선택 시 자동 입력됩니다.</div>
</th:block>
