<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="storefrontHeader" class="card border-0 shadow-sm mb-3 storefront-header">
    <div class="card-body py-3">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div>
          <h4 class="mb-0" th:text="${tenantCompanyName != null ? tenantCompanyName : appBrandName}">쇼핑몰</h4>
          <p class="text-600 fs--1 mb-0" th:if="${tenantResolvedHost != null}">
            <span class="fas fa-store me-1"></span>
            <span th:text="${tenantResolvedHost}">host</span>
          </p>
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <a class="btn btn-falcon-default btn-sm" th:href="@{/app/e-commerce/shopping-cart}" data-menu-persist="true">
            <span class="fas fa-shopping-cart me-1"></span>장바구니
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
