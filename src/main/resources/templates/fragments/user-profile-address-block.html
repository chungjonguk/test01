<!-- 프로필 설정 — 자택/직장 주소·전화 블록 (idPrefix: home | work) -->
<th:block xmlns:th="http://www.thymeleaf.org"
          th:fragment="addressBlock(idPrefix, title, typeCode, zipVal, baseVal, detailVal, phoneVal, primaryType, companyNameVal)">
  <div class="card border mb-3 user-settings-address-card">
    <div class="card-header bg-light py-2 d-flex flex-wrap justify-content-between align-items-center gap-2">
      <h6 class="mb-0 fw-bold" th:text="${title}">주소</h6>
      <div class="form-check mb-0">
        <input class="form-check-input settings-primary-address" type="checkbox"
               th:id="|settings-primary-${idPrefix}|"
               th:attr="data-address-type=${typeCode}"
               th:checked="${primaryType == typeCode}" />
        <label class="form-check-label fs--1 fw-semi-bold"
               th:for="|settings-primary-${idPrefix}|">기본 주소로 사용</label>
      </div>
    </div>
    <div class="card-body pt-3 pb-3">
      <div class="mb-3" th:if="${idPrefix == 'work'}">
        <label class="form-label fs--1 mb-1" th:for="work-company-name">직장명</label>
        <input class="form-control form-control-sm" type="text" id="work-company-name"
               maxlength="200" placeholder="예: (주)프린트몰"
               th:value="${companyNameVal}" autocomplete="organization" />
      </div>
      <div class="mb-3">
        <label class="form-label fs--1 mb-1"
               th:for="|${idPrefix}-phone|">전화번호</label>
        <input class="form-control form-control-sm" type="tel"
               th:id="|${idPrefix}-phone|"
               maxlength="13" placeholder="010-1234-5678"
               th:value="${phoneVal}" autocomplete="tel"
               inputmode="tel" />
        <div class="form-text">숫자만 입력해도 자동으로 하이픈(-) 형식이 적용됩니다.</div>
      </div>
      <div class="mb-2" th:replace="~{fragments/kakao-address-search :: addressSearchMap(${idPrefix})}"></div>
      <div class="row g-2">
        <div class="col-md-3">
          <label class="form-label fs--1 mb-1" th:for="|${idPrefix}-address-zip|">우편번호</label>
          <input class="form-control form-control-sm bg-100" type="text"
                 th:id="|${idPrefix}-address-zip|"
                 th:value="${zipVal}"
                 placeholder="검색 후 자동 입력" maxlength="5"
                 readonly="readonly" tabindex="-1" autocomplete="postal-code" />
        </div>
        <div class="col-md-9">
          <label class="form-label fs--1 mb-1" th:for="|${idPrefix}-address-base|">기본 주소</label>
          <input class="form-control form-control-sm bg-100" type="text"
                 th:id="|${idPrefix}-address-base|"
                 th:value="${baseVal}"
                 placeholder="주소 검색 후 자동 입력"
                 readonly="readonly" tabindex="-1" autocomplete="street-address" />
        </div>
        <div class="col-12">
          <label class="form-label fs--1 mb-1" th:for="|${idPrefix}-address-detail|">상세 주소</label>
          <input class="form-control form-control-sm" type="text"
                 th:id="|${idPrefix}-address-detail|"
                 th:value="${detailVal}"
                 maxlength="200" placeholder="동·호수 등 상세 주소 (직접 입력)"
                 autocomplete="address-line2" />
        </div>
      </div>
      <div class="form-text mb-0 mt-2">우편번호·기본 주소는 카카오 검색 선택 시 자동 입력됩니다.</div>
    </div>
  </div>
</th:block>
