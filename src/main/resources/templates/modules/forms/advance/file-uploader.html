<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <th:block th:replace="~{layout :: body}">
    <div th:fragment="page-content">
        <link th:href="@{/vendors/dropzone/dropzone.min.css}" rel="stylesheet" />
        <style>
            .dropzone.dropzone-single .dz-preview-single:empty {
                pointer-events: none;
            }
        </style>

        <div class="card mb-3">
            <div class="bg-holder d-none d-lg-block bg-card"
                 th:style="|background-image:url(@{/assets/img/icons/spot-illustrations/corner-4.png});|"></div>
            <div class="card-body position-relative">
                <div class="row">
                    <div class="col-lg-8">
                        <h3>File Uploader</h3>
                        <p class="mt-2">Falcon은 <b>DropzoneJS</b>로 파일 업로드(드래그 앤 드롭·미리보기)를 제공합니다.</p>
                        <a class="btn btn-link ps-0 btn-sm" href="https://www.dropzonejs.com/" target="_blank" rel="noopener">
                            Dropzone 문서<span class="fas fa-chevron-right ms-1 fs--2"></span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">
                <h5 class="mb-0">단일 파일 업로드</h5>
                <p class="mb-0 pt-1 mt-2 text-600">파일을 드래그하거나 클릭해 선택하면 서버로 업로드됩니다.</p>
            </div>
            <div class="card-body bg-light">
                <form class="dropzone dropzone-single p-0" id="dropzone-single" data-dropzone="data-dropzone"
                      data-options='{"url":"/api/upload","maxFiles":1,"paramName":"file","autoProcessQueue":true}'>
                    <div class="fallback">
                        <input type="file" name="file" />
                    </div>
                    <div class="dz-preview dz-preview-single">
                        <div class="dz-preview-cover">
                            <img class="dz-preview-img" src="" alt="" data-dz-thumbnail="" />
                            <a class="dz-remove text-danger" href="#!" data-dz-remove="data-dz-remove">
                                <span class="fas fa-times"></span>
                            </a>
                            <div class="dz-progress"><span class="dz-upload" data-dz-uploadprogress=""></span></div>
                            <div class="dz-errormessage m-1"><span data-dz-errormessage="data-dz-errormessage"></span></div>
                        </div>
                        <div class="dz-progress"><span class="dz-upload" data-dz-uploadprogress=""></span></div>
                    </div>
                    <div class="dz-message" data-dz-message="data-dz-message">
                        <img class="me-2" th:src="@{/assets/img/icons/cloud-upload.svg}" width="25" alt="" />
                        <span class="dz-message-text">파일을 여기에 놓거나 클릭하세요</span>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">
                <h5 class="mb-0">다중 파일 업로드</h5>
            </div>
            <div class="card-body bg-light">
                <form class="dropzone dropzone-multiple p-0" id="dropzone-multiple"
                      data-dropzone="data-dropzone"
                      data-options='{"url":"/api/upload","paramName":"file","autoProcessQueue":true}'>
                    <div class="fallback">
                        <input name="file" type="file" multiple="multiple" />
                    </div>
                    <div class="dz-message" data-dz-message="data-dz-message">
                        <img class="me-2" th:src="@{/assets/img/icons/cloud-upload.svg}" width="25" alt="" />
                        Drop your files here
                    </div>
                    <div class="dz-preview dz-preview-multiple m-0 d-flex flex-column">
                        <div class="d-flex media mb-3 pb-3 border-bottom btn-reveal-trigger">
                            <img class="dz-image" src="" alt="" data-dz-thumbnail="data-dz-thumbnail" />
                            <div class="flex-1 d-flex flex-between-center">
                                <div>
                                    <h6 data-dz-name="data-dz-name"></h6>
                                    <div class="d-flex align-items-center">
                                        <p class="mb-0 fs--1 text-400 lh-1" data-dz-size="data-dz-size"></p>
                                        <div class="dz-progress"><span class="dz-upload" data-dz-uploadprogress=""></span></div>
                                    </div>
                                    <span class="fs--2 text-danger" data-dz-errormessage="data-dz-errormessage"></span>
                                </div>
                                <div class="dropdown font-sans-serif">
                                    <button class="btn btn-link text-600 btn-sm dropdown-toggle btn-reveal dropdown-caret-none"
                                            type="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                        <span class="fas fa-ellipsis-h"></span>
                                    </button>
                                    <div class="dropdown-menu dropdown-menu-end border py-2">
                                        <a class="dropdown-item" href="#!" data-dz-remove="data-dz-remove">Remove File</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    </th:block>
</body>
</html>
