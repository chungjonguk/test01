<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth-simple :: head}"></head>
<body class="auth-simple-page auth-card-page">
    <th:block th:replace="~{fragments/app-loading :: bar}"></th:block>

    <main class="main" id="top">
<div class="container">
        <div class="row min-vh-100 flex-center g-0">
          <div class="col-lg-8 col-xxl-5 py-3 position-relative"><img class="bg-auth-circle-shape" th:src="@{/assets/img/icons/spot-illustrations/bg-shape.png}" alt="" width="250"><img class="bg-auth-circle-shape-2" th:src="@{/assets/img/icons/spot-illustrations/shape-1.png}" alt="" width="150">
            <div class="card overflow-hidden z-index-1">
              <div class="card-body p-0">
                <div class="row g-0 h-100">
                  <div class="col-md-5 text-center bg-card-gradient">
                    <div class="position-relative p-4 pt-md-5 pb-md-7 light">
                      <div class="bg-holder bg-auth-card-shape" style="background-image:url(/assets/img/icons/spot-illustrations/half-circle.png);">
                      </div>
                      <!--/.bg-holder-->

                      <div class="z-index-1 position-relative"><a class="link-light mb-4 font-sans-serif fs-4 d-inline-block fw-bolder" th:href="@{/}">PrintMall</a>
                        <p class="opacity-75 text-white">회원가입 후 서비스를 이용해 보세요.</p>
                      </div>
                    </div>
                    <div class="mt-3 mb-4 mt-md-4 mb-md-5 light">
                      <p class="pt-3 text-white">이미 계정이 있으신가요?<br><a class="btn btn-outline-light mt-2 px-4" th:href="@{/pages/authentication/card/login}">로그인</a></p>
                    </div>
                  </div>
                  <div class="col-md-7 d-flex flex-center">
                    <div class="p-4 p-md-5 flex-grow-1">
                      <h3>회원가입</h3>
                      <form data-auth-register
                            th:attr="data-check-email-url=@{/users/check-email},data-redirect-url=@{/users}">
                        <div class="mb-3">
                          <label class="form-label" for="card-email">이메일 <span class="text-danger">*</span></label>
                          <div class="input-group">
                            <input class="form-control" type="email" autocomplete="email" id="card-email" data-auth-email required />
                            <button class="btn btn-outline-primary" type="button" data-auth-check-email>중복 확인</button>
                          </div>
                          <div class="form-text text-muted" data-auth-email-message>이메일 중복 확인 후 나머지 항목을 입력할 수 있습니다.</div>
                        </div>
                        <fieldset data-auth-register-fields class="border-0 p-0 m-0" disabled>
                          <div class="mb-3">
                            <label class="form-label" for="card-name">이름</label>
                            <input class="form-control" type="text" autocomplete="name" id="card-name" />
                          </div>
                          <div class="row gx-2">
                            <div class="mb-3 col-sm-6">
                              <label class="form-label" for="card-password">비밀번호</label>
                              <input class="form-control" type="password" autocomplete="new-password" id="card-password" data-auth-password required />
                              <div class="form-text text-muted">영문자, 숫자, 특수문자를 각각 1자 이상 포함해 주세요.</div>
                            </div>
                            <div class="mb-3 col-sm-6">
                              <label class="form-label" for="card-confirm-password">비밀번호 확인</label>
                              <input class="form-control" type="password" autocomplete="new-password" id="card-confirm-password" data-auth-confirm-password required />
                            </div>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="card-register-checkbox" required />
                            <label class="form-label" for="card-register-checkbox"><a href="#!">이용약관</a> 및 <a href="#!">개인정보 처리방침</a>에 동의합니다.</label>
                          </div>
                          <div class="mb-3">
                            <button class="btn btn-primary d-block w-100 mt-3" type="submit" name="submit">다음 단계 (상세 정보 입력)</button>
                          </div>
                        </fieldset>
                      </form>
                      <div class="position-relative mt-4">
                        <hr />
                        <div class="divider-content-center">또는 소셜 계정으로 가입</div>
                      </div>
                      <div class="row g-2 mt-2">
                        <div class="col-sm-6"><a class="btn btn-outline-google-plus btn-sm d-block w-100" href="#"><span class="fab fa-google-plus-g me-2" data-fa-transform="grow-8"></span> google</a></div>
                        <div class="col-sm-6"><a class="btn btn-outline-facebook btn-sm d-block w-100" href="#"><span class="fab fa-facebook-square me-2" data-fa-transform="grow-8"></span> facebook</a></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <th:block th:replace="~{fragments/settings :: settings}"></th:block>
    <th:block th:replace="~{fragments/auth-simple :: scripts}"></th:block>
    <script th:src="@{/assets/js/user-form-validation.js(v=2)}"></script>
    <script th:src="@{/assets/js/auth-register.js(v=2)}"></script>
</body>
</html>
