<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth-simple :: head}"></head>
<body class="auth-simple-page">
    <th:block th:replace="~{fragments/app-loading :: bar}"></th:block>

    <main class="main" id="top">
        <div class="container" data-layout="container">
            <div class="row flex-center min-vh-100 py-6">
                <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
                    <a class="d-flex flex-center mb-4" th:href="@{${brandHomeUrl}}">
                        <span class="font-sans-serif fw-bolder fs-5 d-inline-block" th:text="${appBrandName}">PrintMall</span>
                    </a>
                    <div class="card">
                        <div class="card-body p-4 p-sm-5">
                            <div class="text-center">
                                <img class="d-block mx-auto mb-4" th:src="@{/assets/img/icons/spot-illustrations/16.png}" alt="Email" width="100" />
                                <h4 class="mb-2">Please check your email!</h4>
                                <p>An email has been sent to <strong>xyz@abc.com</strong>. Please click on the included link to reset your password.</p>
                                <a class="btn btn-primary btn-sm mt-3" th:href="@{/pages/authentication/simple/login}">
                                    <span class="fas fa-chevron-left me-1" data-fa-transform="shrink-4 down-1"></span>Return to login
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/settings :: settings}"></th:block>
    <th:block th:replace="~{fragments/auth-simple :: scripts}"></th:block>
</body>
</html>
