<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth-simple :: head}"></head>
<body class="auth-simple-page auth-split-page">
    <th:block th:replace="~{fragments/app-loading :: bar}"></th:block>

    <main class="main" id="top">
<div class="container">
<div class="row min-vh-100 bg-100">
          <div class="col-6 d-none d-lg-block position-relative">
            <div class="bg-holder" style="background-image:url(/assets/img/generic/19.jpg);">
            </div>
            <!--/.bg-holder-->

          </div>
          <div class="col-sm-10 col-md-6 px-sm-0 align-self-center mx-auto py-5">
            <div class="row justify-content-center g-0">
              <div class="col-lg-9 col-xl-8 col-xxl-6">
                <div class="card">
                  <div class="card-header bg-circle-shape bg-shape text-center p-2"><a class="font-sans-serif fw-bolder fs-4 z-index-1 position-relative link-light light" th:href="@{/}">PrintMall</a></div>
                  <div class="card-body p-4">
                    <div class="row flex-between-center">
                      <div class="col-auto">
                        <h3>회원가입</h3>
                      </div>
                      <div class="col-auto fs--1 text-600"><span class="mb-0 fw-semi-bold">이미 계정이 있으신가요?</span> <span><a th:href="@{/pages/authentication/split/login}">로그인</a></span></div>
                    </div>
                    <form data-auth-register
                          th:attr="data-check-email-url=@{/users/check-email},data-redirect-url=@{/users}">
                      <div class="mb-3">
                        <label class="form-label" for="split-email">이메일 <span class="text-danger">*</span></label>
                        <div class="input-group">
                          <input class="form-control" type="email" autocomplete="email" id="split-email" data-auth-email required />
                          <button class="btn btn-outline-primary" type="button" data-auth-check-email>중복 확인</button>
                        </div>
                        <div class="form-text text-muted" data-auth-email-message>이메일 중복 확인 후 나머지 항목을 입력할 수 있습니다.</div>
                      </div>
                      <fieldset data-auth-register-fields class="border-0 p-0 m-0" disabled>
                        <div class="mb-3">
                          <label class="form-label" for="split-name">이름</label>
                          <input class="form-control" type="text" autocomplete="name" id="split-name" />
                        </div>
                        <div class="row gx-2">
                          <div class="mb-3 col-sm-6">
                            <label class="form-label" for="split-password">비밀번호</label>
                            <input class="form-control" type="password" autocomplete="new-password" id="split-password" data-auth-password required />
                            <div class="form-text text-muted">영문자, 숫자, 특수문자를 각각 1자 이상 포함해 주세요.</div>
                          </div>
                          <div class="mb-3 col-sm-6">
                            <label class="form-label" for="split-confirm-password">비밀번호 확인</label>
                            <input class="form-control" type="password" autocomplete="new-password" id="split-confirm-password" data-auth-confirm-password required />
                          </div>
                        </div>
                        <div class="form-check">
                          <input class="form-check-input" type="checkbox" id="cover-register-checkbox" required />
                          <label class="form-label" for="cover-register-checkbox"><a href="#!">이용약관</a> 및 <a href="#!">개인정보 처리방침</a>에 동의합니다.</label>
                        </div>
                        <div class="mb-3">
                          <button class="btn btn-primary d-block w-100 mt-3" type="submit" name="submit">다음 단계 (상세 정보 입력)</button>
                        </div>
                      </fieldset>
                    </form>
                    <div class="position-relative mt-4">
                      <hr />
                      <div class="divider-content-center">또는 소셜 계정으로 가입</div>
                    </div>
                    <div class="row g-2 mt-2">
                      <div class="col-sm-6"><a class="btn btn-outline-google-plus btn-sm d-block w-100" href="#"><span class="fab fa-google-plus-g me-2" data-fa-transform="grow-8"></span> google</a></div>
                      <div class="col-sm-6"><a class="btn btn-outline-facebook btn-sm d-block w-100" href="#"><span class="fab fa-facebook-square me-2" data-fa-transform="grow-8"></span> facebook</a></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <th:block th:replace="~{fragments/settings :: settings}"></th:block>
    <th:block th:replace="~{fragments/auth-simple :: scripts}"></th:block>
    <script th:src="@{/assets/js/user-form-validation.js(v=2)}"></script>
    <script th:src="@{/assets/js/auth-register.js(v=2)}"></script>
</body>
</html>
