<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth-simple :: head}"></head>
<body class="auth-simple-page">
    <th:block th:replace="~{fragments/app-loading :: bar}"></th:block>

    <main class="main" id="top">
<div class="container" data-layout="container">
        <div class="row flex-center min-vh-100 py-6 text-center">
          <div class="col-sm-10 col-md-8 col-lg-6 col-xxl-5"><a class="d-flex flex-center mb-4" th:href="@{/}"><img class="me-2" th:src="@{/assets/img/icons/spot-illustrations/falcon.png}" alt="" width="58" /><span class="font-sans-serif fw-bolder fs-5 d-inline-block">PrintMall</span></a>
            <div class="card">
              <div class="card-body p-4 p-sm-5">
                <div class="fw-black lh-1 text-300 fs-error">403</div>
                <p class="lead mt-4 text-800 font-sans-serif fw-semi-bold w-md-75 w-xl-100 mx-auto" th:if="${param.msg == null}">이 화면에 대한 접근 권한이 없습니다.</p>
                <p class="lead mt-4 text-800 font-sans-serif fw-semi-bold w-md-75 w-xl-100 mx-auto" th:if="${param.msg != null}" th:text="${param.msg[0]}">접근 권한이 없습니다.</p>
                <hr />
                <p class="mb-0 text-600">로그인 화면이 아닙니다. 계정 권한이 맞는지 관리자에게 문의하세요.</p>
                <a class="btn btn-primary btn-sm mt-3" th:href="@{/dashboard}"><span class="fas fa-home me-2"></span>대시보드로</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <th:block th:replace="~{fragments/settings :: settings}"></th:block>
    <th:block th:replace="~{fragments/auth-simple :: scripts}"></th:block>
</body>
</html>
