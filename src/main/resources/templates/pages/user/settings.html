<!DOCTYPE html>
<html lang="ko" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <th:block th:replace="~{layout :: body}">
    <div th:fragment="page-content">

              <div id="user-settings-message" class="mb-3" aria-live="polite"></div>

              <div class="card mb-3 btn-reveal-trigger" id="user-settings-profile-card">
                <div class="card-header position-relative min-vh-25 mb-8">
                  <div class="cover-image">
                    <div class="bg-holder rounded-3 rounded-bottom-0 user-settings-cover-bg"
                         th:style="|background-image:url(${userCoverImageUrl != null and !#strings.isEmpty(userCoverImageUrl) ? userCoverImageUrl : '/assets/img/generic/4.jpg'});|">
                    </div>
                    <input class="d-none" id="upload-cover-image" type="file" accept="image/*" />
                    <label class="cover-image-file-input" for="upload-cover-image">
                      <span class="fas fa-camera me-2"></span><span>커버 이미지 변경</span>
                    </label>
                  </div>
                  <div class="avatar avatar-5xl avatar-profile shadow-sm img-thumbnail rounded-circle">
                    <div class="h-100 w-100 rounded-circle overflow-hidden position-relative bg-light">
                      <img id="user-settings-profile-img"
                           class="user-settings-profile-img"
                           th:src="${userProfileImageUrl != null and !userProfileImageUrl.isEmpty()} ? ${userProfileImageUrl} : @{/assets/img/team/2.jpg}"
                           width="200" alt="프로필" />
                      <div id="user-settings-profile-initial"
                           class="user-settings-profile-initial d-none align-items-center justify-content-center h-100 w-100 fw-bold fs-2 text-primary"
                           th:text="${settingsUser != null and !#strings.isEmpty(settingsUser.name)} ? ${#strings.substring(settingsUser.name, 0, 1)} : (${loginUser != null and !#strings.isEmpty(loginUser.userName)} ? ${#strings.substring(loginUser.userName, 0, 1)} : 'U')">U</div>
                      <input class="d-none" id="profile-image" type="file" accept="image/*" />
                      <label class="mb-0 overlay-icon d-flex flex-center" for="profile-image">
                        <span class="bg-holder overlay overlay-0"></span>
                        <span class="z-index-1 text-white text-center fs--1">
                          <span class="fas fa-camera"></span><span class="d-block">프로필 변경</span>
                        </span>
                      </label>
                    </div>
                  </div>
                  <p class="text-600 fs--2 mb-0 mt-2 px-1" id="user-settings-profile-hint">
                    프로필 사진: JPG·PNG·GIF·WebP, 최대 2MB · 커버: 최대 5MB
                  </p>
                </div>
              </div>

              <div class="card mb-3" id="user-settings-form-card">
                <div class="card-header">
                  <h5 class="mb-0">프로필 정보</h5>
                </div>
                <div class="card-body bg-light">
                  <form class="row g-3" id="user-settings-profile-form" novalidate>
                    <div class="col-lg-6">
                      <label class="form-label" for="settings-user-id">아이디 <span class="text-danger">*</span></label>
                      <input class="form-control" id="settings-user-id" name="userId" type="text" required readonly
                             th:value="${settingsUser != null ? settingsUser.id : (loginUser != null ? loginUser.userId : '')}" />
                    </div>
                    <div class="col-lg-6">
                      <label class="form-label" for="settings-user-name">이름 <span class="text-danger">*</span></label>
                      <input class="form-control" id="settings-user-name" name="name" type="text" required maxlength="100"
                             th:value="${settingsUser != null ? settingsUser.name : ''}" />
                    </div>
                    <div class="col-lg-12">
                      <label class="form-label" for="settings-user-email">이메일 <span class="text-danger">*</span></label>
                      <input class="form-control" id="settings-user-email" name="email" type="email" required maxlength="100"
                             th:value="${settingsUser != null ? settingsUser.email : ''}" />
                    </div>
                    <div class="col-12">
                      <p class="form-label mb-2">연락처 주소</p>
                      <p class="text-600 fs--2 mb-3">자택·직장 주소를 각각 등록하고, 기본으로 사용할 주소를 체크하세요.</p>
                      <th:block th:with="primary=${settingsUser != null and settingsUser.primaryAddressType == 'WORK' ? 'WORK' : 'HOME'},
                                        homeZip=${settingsUser != null and !#strings.isEmpty(settingsUser.homeZipcode) ? settingsUser.homeZipcode : (settingsUser != null ? settingsUser.zipcode : '')},
                                        homeAddr=${settingsUser != null and !#strings.isEmpty(settingsUser.homeAddress) ? settingsUser.homeAddress : (settingsUser != null ? settingsUser.address : '')},
                                        homeDetail=${settingsUser != null and !#strings.isEmpty(settingsUser.homeAddressDetail) ? settingsUser.homeAddressDetail : (settingsUser != null ? settingsUser.addressDetail : '')}">
                        <div th:replace="~{fragments/user-profile-address-block :: addressBlock('home', '자택', 'HOME', ${homeZip}, ${homeAddr}, ${homeDetail}, ${settingsUser != null ? settingsUser.homePhone : ''}, ${primary}, '')}"></div>
                        <div th:replace="~{fragments/user-profile-address-block :: addressBlock('work', '직장', 'WORK', ${settingsUser != null ? settingsUser.workZipcode : ''}, ${settingsUser != null ? settingsUser.workAddress : ''}, ${settingsUser != null ? settingsUser.workAddressDetail : ''}, ${settingsUser != null ? settingsUser.workPhone : ''}, ${primary}, ${settingsUser != null ? settingsUser.workCompanyName : ''})}"></div>
                      </th:block>
                    </div>
                    <div class="col-12 d-flex justify-content-end">
                      <button class="btn btn-primary" type="submit" id="settings-save-btn">저장</button>
                    </div>
                  </form>
                </div>
              </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    </th:block>
    <script th:if="${loadUserSettingsActions}">
      (function () {
        function boot() {
          if (typeof window.UserSettingsInit === 'function') {
            window.UserSettingsInit();
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', boot);
        } else {
          boot();
        }
      })();
    </script>
</body>
</html>
