spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.springbootapp.domain
mybatis.configuration.map-underscore-to-camel-case=true

app.crypto.rrno.secret-key=${RRNO_CRYPTO_SECRET_KEY:abcdefghijklmnopqrstuvwxyz123456}

kakao.client-id=test-client-id
kakao.client-secret=
kakao.redirect-uri=http://localhost:8080/auth/kakao/callback
kakao.authorize-url=https://kauth.kakao.com/oauth/authorize
kakao.token-url=https://kauth.kakao.com/oauth/token
kakao.userinfo-url=https://kapi.kakao.com/v2/user/me
