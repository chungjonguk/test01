spring.profiles.active=test

app.grid.page-size=30

# 이 PC에 E: 드라이브가 없어 기본 NAS 경로(E:/nas-storage/...) 생성 시 테스트 컨텍스트가 실패함
app.storage.nas.enabled=true
app.storage.nas.base-path=${java.io.tmpdir}/printmall-nas-test

# DATABASE_TO_LOWER: MyBatis의 "user" 인용과 H2 식별자 대소문자 맞춤
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# 본 앱의 PostgreSQL 스키마 자동적용은 테스트에서 끔
app.schema.auto-apply=false
app.datasource.startup-check=false
app.datasource.auto-bootstrap-mysql=false

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.springbootapp.domain
mybatis.configuration.map-underscore-to-camel-case=true

app.crypto.rrno.secret-key=${RRNO_CRYPTO_SECRET_KEY:abcdefghijklmnopqrstuvwxyz123456}

kakao.client-id=test-client-id
kakao.client-secret=
kakao.redirect-uri=http://localhost:8080/auth/kakao/callback
kakao.authorize-url=https://kauth.kakao.com/oauth/authorize
kakao.token-url=https://kauth.kakao.com/oauth/token
kakao.userinfo-url=https://kapi.kakao.com/v2/user/me

naver.client-id=test-naver-client-id
naver.client-secret=test-naver-client-secret
naver.redirect-uri=http://localhost:8081/auth/naver/callback
naver.authorize-url=https://nid.naver.com/oauth2.0/authorize
naver.token-url=https://nid.naver.com/oauth2.0/token
naver.userinfo-url=https://openapi.naver.com/v1/nid/me
